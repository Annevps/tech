<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090b">
<title>Contato — TechEmpire</title>
<meta name="description" content="Fale com a TechEmpire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contato" data-auth="public">
  <!-- Coloque logo no início da tag <body> em cada página -->
<nav style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#111827; color:white;">
    <div>
        <a href="index.html" style="color:white; margin-right:15px; text-decoration:none;">Início</a>
        <a href="servicos.html" style="color:white; margin-right:15px; text-decoration:none;">Serviços</a>
        <a href="chamado.html" style="color:white; margin-right:15px; text-decoration:none;">Chamados</a>
        <a href="contato.html" style="color:white; text-decoration:none;">Contato</a>
    </div>
    
    <!-- Status do Banco de Dados no Menu -->
    <div style="display:flex; align-items:center; gap:8px;">
        <span class="status-dot" style="width:10px; height:10px; border-radius:50%; background:gray; display:inline-block;"></span>
        <span id="status-text">Conectando...</span>
    </div>
</nav>

<style>
    .status-dot.green { background-color: #10b981 !important; }
    .status-dot.red { background-color: #ef4444 !important; }
</style>
<header id="site-header"></header>
<main class="wrap-main">
<section class="hero" style="align-items:start">
  <div><span class="badge">Contato</span><h1 style="font-size:clamp(38px,6vw,64px)">Vamos <em>conversar.</em></h1><p class="lead">Conte o que você precisa. Respondemos pelo e-mail ou WhatsApp que você informar ao lado.</p>
  <p class="sub" style="margin-top:22px">Já é cliente? <a href="login.html" style="color:var(--lime)">Entre na sua conta</a> e converse direto pelo chat do seu chamado.</p></div>
  <div class="panel" style="width:100%"><form id="f-contato" novalidate>
    <label>Nome<input name="nome" required autocomplete="name"></label>
    <div class="two"><label>E-mail<input name="email" type="email" autocomplete="email"></label><label>WhatsApp<input name="telefone" inputmode="tel" autocomplete="tel"></label></div>
    <label>Serviço de interesse<select name="servico"><option value="">Selecione</option><option>Manutenção de computador</option><option>Assistência de celular</option><option>Suporte técnico</option><option>Manutenção preventiva</option><option>Criação de site</option><option>Outro</option></select></label>
    <label>Mensagem<textarea name="mensagem" required></textarea></label>
    <div class="msg" id="m-contato" role="alert"></div>
    <button class="btn primary" type="submit">Enviar mensagem</button></form></div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
