<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090b">
<title>Entrar — TechEmpire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login" data-auth="guest">
<header id="site-header"></header>

<main class="wrap-main">
  <div class="panel">
    <h2>Entrar</h2>
    <p class="sub">Acesse sua conta para acompanhar seus chamados.</p>
    
    <form id="f-login">
      <label>E-mail
        <input name="email" type="email" required autocomplete="email" placeholder="seu@email.com">
      </label>
      <label>Senha
        <input name="senha" type="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      
      <div class="msg" id="m-login" role="alert"></div>
      
      <button class="btn primary" type="submit" id="btn-entrar">Entrar</button>
      
      <p class="sub" style="margin:0">
        <a href="recuperar-senha.html">Esqueci minha senha</a> · <a href="criar-conta.html">Criar conta</a>
      </p>
    </form>
  </div>
</main>

<footer id="site-footer"></footer>

<!-- Importa as bibliotecas do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>

<!-- SCRIPT EXCLUSIVO DE LOGIN E REDIRECIONAMENTO -->
<script>
  document.getElementById('f-login').addEventListener('submit', async (e) => {
    e.preventDefault(); // Impede o recarregamento da página
    
    const email = e.target.email.value.trim().toLowerCase();
    const senha = e.target.senha.value;
    const btn = document.getElementById('btn-entrar');
    const msgErro = document.getElementById('m-login');

    btn.disabled = true;
    btn.textContent = "Entrando...";
    msgErro.className = "msg"; // Esconde mensagens antigas

    const sb = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    
    // Tenta fazer o login no Supabase
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });

    if (error) {
      btn.disabled = false;
      btn.textContent = "Entrar";
      msgErro.textContent = "E-mail ou senha incorretos.";
      msgErro.className = "msg on err";
      return;
    }

    // ==========================================
    // O SEGREDO PARA NÃO DAR LOOP
    // Salva o ID e o E-mail no navegador (sessionStorage)
    // ==========================================
    sessionStorage.setItem('te_user_id', data.user.id);
    sessionStorage.setItem('te_user_email', data.user.email);

    // ==========================================
    // REDIRECIONAMENTO INTELIGENTE
    // ==========================================
    if (email === 'admin@tech.com') {
      // Se for o admin, vai direto para o painel de admin
      window.location.href = "admin.html";
    } else {
      // Se for cliente, vai para o painel do cliente
      window.location.href = "painel.html";
    }
  });
</script>
</body>
</html>
