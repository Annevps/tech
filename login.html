<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090b">
<title>Entrar — TechEmpire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login" data-auth="guest">
  <!-- Coloque logo no início da tag <body> em cada página -->
<nav style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#111827; color:white;">
    <div>
        <a href="index.html" style="color:white; margin-right:15px; text-decoration:none;">Início</a>
        <a href="servicos.html" style="color:white; margin-right:15px; text-decoration:none;">Serviços</a>
        <a href="chamado.html" style="color:white; margin-right:15px; text-decoration:none;">Chamados</a>
        <a href="contato.html" style="color:white; text-decoration:none;">Contato</a>
    </div>
    
    <!-- Status do Banco de Dados no Menu -->
    <div style="display:flex; align-items:center; gap:8px;">
        <span class="status-dot" style="width:10px; height:10px; border-radius:50%; background:gray; display:inline-block;"></span>
        <span id="status-text">Conectando...</span>
    </div>
</nav>

<style>
    .status-dot.green { background-color: #10b981 !important; }
    .status-dot.red { background-color: #ef4444 !important; }
</style>
<header id="site-header"></header>
<main class="wrap-main">
<div class="panel"><h2>Entrar</h2><p class="sub">Acesse sua conta para acompanhar seus chamados.</p>
<form id="f-login">
  <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
  <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
  <div class="msg" id="m-login" role="alert"></div>
  <button class="btn primary" type="submit">Entrar</button>
  <p class="sub" style="margin:0"><a href="recuperar-senha.html">Esqueci minha senha</a> · <a href="criar-conta.html">Criar conta</a></p>
</form></div>
</main>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
