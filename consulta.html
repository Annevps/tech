<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultar Atendimento — TechEmpire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .consulta-box { max-width: 500px; margin: 80px auto; background: var(--s1); padding: 40px; border-radius: 24px; border: 1px solid var(--line2); text-align: center; }
  .consulta-box h1 { font-size: 32px; margin-bottom: 16px; font-family: 'Space Grotesk'; color: var(--ink); }
  .consulta-box h1 em { color: var(--lime); font-style: normal; }
  .consulta-box p { color: var(--muted); margin-bottom: 32px; }
  .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
  .input-group input { flex: 1; padding: 16px; border-radius: 12px; border: 1px solid var(--line2); background: var(--bg); color: var(--ink); font-size: 16px; text-align: center; text-transform: uppercase; }
  .input-group button { padding: 0 24px; border-radius: 12px; background: var(--lime); color: #fff; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
  .input-group button:hover { background: var(--lime2); }
  .consulta-box{max-width:620px;margin:64px auto;padding:clamp(26px,5vw,48px);box-shadow:0 18px 50px rgba(15,23,42,.07)}
  .consulta-box:before{content:'ACOMPANHAMENTO DE SERVIÇO';display:inline-flex;padding:7px 12px;border-radius:99px;background:var(--tint);color:var(--lime2);font-size:11px;font-weight:700;letter-spacing:.12em;margin-bottom:20px}
  .consulta-box h1{font-size:clamp(30px,5vw,42px);letter-spacing:-.04em}
  .consulta-box p{max-width:440px;margin:0 auto 28px;line-height:1.7}
  .input-group input{text-align:left;padding:16px 18px}
  .input-group button{min-height:54px;padding:0 26px}
  #msg-consulta{min-height:24px}
  @media(max-width:560px){.consulta-box{margin:30px auto;padding:24px 18px}.input-group{flex-direction:column}.input-group button{padding:14px}}
</style>
</head>
<body data-page="consulta" data-auth="public">
<header id="site-header"></header>

<main class="wrap-main">
  <div class="consulta-box">
    <h1>Consulte seu <em>Atendimento</em></h1>
    <p>Digite o número do protocolo que você recebeu no momento da solicitação.</p>
    
    <form id="form-consulta">
      <div class="input-group">
        <input type="text" id="protocolo" placeholder="TE-20231025-0001" required>
        <button type="submit">Buscar</button>
      </div>
    </form>
    <div class="msg" id="msg-consulta"></div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>

<script>
  document.getElementById('form-consulta').addEventListener('submit', async (e) => {
    e.preventDefault();
    const protocolo = document.getElementById('protocolo').value.trim().toUpperCase();
    const msg = document.getElementById('msg-consulta');
    
    if (!protocolo) return;
    
    msg.textContent = "Buscando...";
    msg.className = "msg on ok";

    const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    
    // Busca no banco
    const { data, error } = await db.from('chamados').select('id').eq('protocolo', protocolo).maybeSingle();

    if (error || !data) {
      msg.textContent = "Protocolo não encontrado. Verifique se digitou corretamente.";
      msg.className = "msg on err";
      return;
    }

    // Redireciona para o laudo com o protocolo correto
    window.location.href = 'laudo.html?id=' + encodeURIComponent(data.id);
  });
</script>
</body>
</html>
