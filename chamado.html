<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Chamado — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body { background: #06080a !important; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
  .container { width: 100%; max-width: 800px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; }
  .box { background: #12161a; border: 1px solid #333; border-radius: 12px; padding: 24px; margin-top: 20px; }
  .chat-container { display: flex; flex-direction: column; height: 400px; background: #0a0d0f; border-radius: 12px; overflow: hidden; margin-top: 15px; border: 1px solid #333; }
  .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .chat-msg { background: #1a1e22; padding: 12px 18px; border-radius: 12px; font-size: 14px; max-width: 80%; border-bottom-left-radius: 2px; align-self: flex-start; }
  .chat-msg.me { background: #b4f03c; color: #000; align-self: flex-end; border-bottom-left-radius: 12px; border-bottom-right-radius: 2px; }
  .chat-msg small { display: block; font-size: 10px; opacity: 0.7; margin-bottom: 4px; }
  .chat-footer { padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; background: #12161a; }
  .chat-footer input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #06080a; color: #fff; outline: none; }
  .chat-footer button { background: #b4f03c; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
  a { color: #b4f03c; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <a href="painel.html">← Voltar para Meus Chamados</a>
  <div id="conteudo"><p>Carregando...</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);

  async function carregarTela() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    const idCliente = session.user.id;

    const params = new URLSearchParams(window.location.search);
    const chamadoId = params.get('id');
    if (!chamadoId) { document.getElementById('conteudo').innerHTML = '<p>Chamado não encontrado.</p>'; return; }

    const { data: c } = await db.from("chamados").select("*").eq("id", chamadoId).single();
    if (!c) { document.getElementById('conteudo').innerHTML = '<p>Chamado não encontrado.</p>'; return; }

    document.getElementById('conteudo').innerHTML = `
      <h1>${c.titulo}</h1>
      <p>Status: <b>${c.status}</b></p>
      <div class="box">
        <h3>Descrição</h3>
        <p>${c.descricao}</p>
      </div>
      <div class="box">
        <h3>💬 Conversa com a TechEmpire</h3>
        <div class="chat-container">
          <div class="chat-body" id="chat-body"><p>Carregando chat...</p></div>
          <form class="chat-footer" id="form-chat">
            <input type="text" id="input-msg" placeholder="Digite sua mensagem..." required>
            <button type="submit">Enviar</button>
          </form>
        </div>
      </div>
    `;

    async function carregarChat() {
      const chatBody = document.getElementById('chat-body');
      const { data } = await db.from('mensagens').select('*').eq('chamado_id', chamadoId).order('criado_em', { ascending: true });
      
      if (!data || data.length === 0) {
        chatBody.innerHTML = `<p style="color:#97a0a6; text-align:center;">Nenhuma mensagem ainda. Envie a primeira!</p>`;
        return;
      }

      chatBody.innerHTML = data.map(msg => {
        const isMe = msg.remetente_id === idCliente;
        return `<div class="chat-msg ${isMe ? 'me' : ''}"><small>${isMe ? 'Você' : 'TechEmpire'}</small>${msg.conteudo}</div>`;
      }).join('');
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    document.getElementById('form-chat').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('input-msg');
      const texto = input.value.trim();
      if (!texto) return;

      const { error } = await db.from('mensagens').insert({ chamado_id: chamadoId, remetente_id: idCliente, conteudo: texto });
      if (error) { alert("Erro ao enviar: " + error.message); } 
      else { input.value = ''; await carregarChat(); }
    };

    await carregarChat();
  }
  carregarTela();
</script>
</body>
</html>
