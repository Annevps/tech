<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhes do Chamado — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #06080a; font-family: 'Inter', sans-serif; color: #fff; min-height: 100vh; padding: 40px 20px; display: flex; justify-content: center; }
  .container { width: 100%; max-width: 800px; }
  .header { margin-bottom: 20px; }
  .voltar { color: #b4f03c; text-decoration: none; font-weight: bold; }
  .box { background: #12161a; border: 1px solid #333; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .box h3 { margin-bottom: 15px; font-family: 'Space Grotesk'; border-bottom: 1px solid #333; padding-bottom: 10px; }
  .chat-container { display: flex; flex-direction: column; height: 450px; background: #0a0d0f; border-radius: 8px; border: 1px solid #222; overflow: hidden; }
  .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .chat-msg { background: #1a1e22; padding: 12px 18px; border-radius: 12px; font-size: 14px; max-width: 80%; border-bottom-left-radius: 2px; align-self: flex-start; }
  .chat-msg.me { background: #b4f03c; color: #000; align-self: flex-end; border-bottom-left-radius: 12px; border-bottom-right-radius: 2px; }
  .chat-msg small { display: block; font-size: 10px; opacity: 0.7; margin-bottom: 4px; }
  .chat-footer { padding: 15px; border-top: 1px solid #222; display: flex; gap: 10px; background: #12161a; }
  .chat-footer input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #06080a; color: #fff; outline: none; }
  .chat-footer button { background: #b4f03c; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a href="painel.html" class="voltar">← Voltar para Meus Chamados</a>
  </div>
  <div id="conteudo"><p style="color: #97a0a6; text-align: center;">Carregando chamado...</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
  
  async function init() {
    let idCliente = sessionStorage.getItem('te_user_id');
    if (!idCliente) {
      const { data: { session } } = await db.auth.getSession();
      if (session) { idCliente = session.user.id; sessionStorage.setItem('te_user_id', idCliente); }
    }
    if (!idCliente) { window.location.href = "login.html"; return; }

    const params = new URLSearchParams(window.location.search);
    const chamadoId = params.get('id');
    if (!chamadoId) { document.getElementById('conteudo').innerHTML = "<p>Chamado não encontrado.</p>"; return; }

    const { data: c } = await db.from("chamados").select("*").eq("id", chamadoId).single();
    if (!c) { document.getElementById('conteudo').innerHTML = "<p>Chamado não encontrado.</p>"; return; }

    document.getElementById('conteudo').innerHTML = `
      <h1 style="font-family: 'Space Grotesk'; font-size: 28px; margin-bottom: 10px;">TE-${String(c.numero).padStart(6, '0')} · ${c.titulo}</h1>
      <p style="margin-bottom: 20px;"><span style="background: rgba(180,240,60,0.15); color: #b4f03c; padding: 4px 12px; border-radius: 99px; font-weight: bold; font-size: 12px;">${c.status}</span></p>
      <div class="box"><h3>Sua Solicitação</h3><p style="white-space: pre-wrap; color: #d1d5db; line-height: 1.6;">${c.descricao}</p></div>
      <div class="box">
        <h3>💬 Conversa com a TechEmpire</h3>
        <div class="chat-container">
          <div class="chat-body" id="chat-body"><p style="text-align:center; color:#97a0a6;">Carregando chat...</p></div>
          <form class="chat-footer" id="form-chat">
            <input type="text" id="input-msg" placeholder="Digite sua mensagem..." required autocomplete="off">
            <button type="submit">Enviar</button>
          </form>
        </div>
      </div>
    `;

    async function carregarChat() {
      const chatBody = document.getElementById('chat-body');
      const { data } = await db.from('mensagens').select('*').eq('chamado_id', chamadoId).order('criado_em', { ascending: true });
      
      if (!data || data.length === 0) { 
        chatBody.innerHTML = `<p style="text-align:center; color:#97a0a6;">Nenhuma mensagem ainda.</p>`; 
        return; 
      }

      // Guarda a posição atual do scroll para não pular para o topo se o usuário estiver lendo
      const isScrolledToBottom = chatBody.scrollHeight - chatBody.scrollTop === chatBody.clientHeight;

      chatBody.innerHTML = data.map(msg => {
        const isMe = msg.remetente_id === idCliente;
        const hora = new Date(msg.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        return `<div class="chat-msg ${isMe ? 'me' : ''}"><small>${isMe ? 'Você' : 'TechEmpire'} · ${hora}</small>${msg.conteudo}</div>`;
      }).join('');

      // Se o usuário já estava no final do chat, rola para baixo novamente
      if (isScrolledToBottom) {
        chatBody.scrollTop = chatBody.scrollHeight;
      }
    }

    document.getElementById('form-chat').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('input-msg');
      const texto = input.value.trim();
      if (!texto) return;
      await db.from('mensagens').insert({ chamado_id: chamadoId, remetente_id: idCliente, conteudo: texto });
      input.value = '';
      await carregarChat(); // Atualiza imediatamente após enviar
    };

    // Carrega a primeira vez
    await carregarChat();

    // O SEGREDO DO TEMPO REAL: Atualiza o chat a cada 3 segundos
    setInterval(() => {
      carregarChat();
    }, 3000);
  }

  init();
</script>
</body>
</html>
