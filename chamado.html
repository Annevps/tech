<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhes do Chamado — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .chamado-grid { display: grid; grid-template-columns: 1fr 400px; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .chamado-grid { grid-template-columns: 1fr; } }
  
  .chamado-info { background: var(--s2); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
  .chamado-info h3 { margin-top: 0; font-family: var(--head); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
  .info-row span:first-child { color: var(--muted); }
  .info-row span:last-child { color: var(--ink); font-weight: 500; }

  /* Linha do tempo */
  .timeline { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); margin-left: 10px; }
  .timeline li { position: relative; padding-left: 24px; margin-bottom: 20px; font-size: 14px; color: var(--muted); }
  .timeline li::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--s2); border: 2px solid var(--line); }
  .timeline li.done { color: var(--ink); }
  .timeline li.done::before { background: var(--lime); border-color: var(--lime); box-shadow: 0 0 10px rgba(180,240,60,0.4); }
  .timeline li b { display: block; font-size: 12px; color: var(--lime); margin-bottom: 2px; }

  /* Chat */
  .chat-container { display: flex; flex-direction: column; height: 500px; background: var(--s1); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; }
  .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .chat-msg { background: var(--s2); padding: 12px 18px; border-radius: 12px; font-size: 14px; max-width: 85%; border-bottom-left-radius: 2px; align-self: flex-start; color: var(--ink); }
  .chat-msg.me { background: var(--lime); color: #000; align-self: flex-end; border-bottom-left-radius: 12px; border-bottom-right-radius: 2px; }
  .chat-msg small { display: block; font-size: 10px; opacity: 0.7; margin-bottom: 4px; }
  .chat-footer { padding: 15px; border-top: 1px solid var(--line); display: flex; gap: 10px; background: var(--s2); }
  .chat-footer input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg); color: var(--ink); outline: none; }
  .chat-footer button { background: var(--lime); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body data-page="chamado" data-auth="client">
<header id="site-header"></header>
<main class="wrap-main">
  <p><a href="painel.html" style="color: var(--lime); text-decoration: none; font-weight: bold;">← Voltar para Meus Chamados</a></p>
  
  <div class="chamado-grid" id="conteudo">
    <p class="empty">Carregando detalhes do chamado...</p>
  </div>
</main>
<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    setTimeout(async () => {
      if (!window.App || !window.App.session) { window.location.href = "login.html"; return; }
      
      const db = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
      const idCliente = window.App.session.user.id;
      
      const params = new URLSearchParams(window.location.search);
      const chamadoId = params.get('id');

      if (!chamadoId) { document.getElementById('conteudo').innerHTML = "<p>Chamado não encontrado.</p>"; return; }

      // Busca dados do chamado e da tabela de detalhes (manutenção ou projeto)
      const { data: c } = await db.from("chamados").select("*").eq("id", chamadoId).single();
      if (!c) { document.getElementById('conteudo').innerHTML = "<p>Chamado não encontrado.</p>"; return; }
      
      const isManutencao = c.categoria === 'manutencao';
      const { data: detalhes } = await db.from(isManutencao ? "detalhes_manutencao" : "detalhes_projetos").select("*").eq("chamado_id", chamadoId).single();

      // Busca histórico, anexos e pagamentos
      const { data: historico } = await db.from("historico_status").select("*").eq("chamado_id", chamadoId).order("criado_em");
      const { data: arquivos } = await db.from("arquivos_chamados").select("*").eq("chamado_id", chamadoId);
      const { data: pagamentos } = await db.from("pagamentos").select("*").eq("chamado_id", chamadoId);

      const etapas = [
        "Nova chamada", "Aguardando análise", "Aguardando aprovação do orçamento", 
        "Aguardando pagamento", "Em andamento", "Concluída"
      ];
      const statusAtualIndex = etapas.indexOf(c.status);

      // Monta a linha do tempo
      let timelineHTML = "";
      etapas.forEach((etapa, index) => {
        const isDone = index <= statusAtualIndex;
        timelineHTML += `<li class="${isDone ? 'done' : ''}"><b>${etapa}</b></li>`;
      });

      // Monta o HTML principal
      document.getElementById('conteudo').innerHTML = `
        <div>
          <div class="chamado-info">
            <h2 style="font-family: var(--head); font-size: 28px; margin-top: 0;">TE-${String(c.numero).padStart(6, '0')} · ${c.titulo}</h2>
            <p><span class="pill">${c.status}</span> <span style="color:var(--muted); margin-left:10px;">Aberto em ${new Date(c.criado_em).toLocaleString('pt-BR')}</span></p>
            
            <h3 style="margin-top: 24px;">Sua Solicitação</h3>
            <p style="white-space: pre-wrap; color: #d1d5db;">${c.descricao}</p>
            
            ${detalhes ? `
              <h3 style="margin-top: 24px;">Detalhes do Dispositivo/Projeto</h3>
              ${isManutencao ? `
                <div class="info-row"><span>Tipo de Dispositivo</span><span>${detalhes.tipo_dispositivo || '—'}</span></div>
                <div class="info-row"><span>Marca</span><span>${detalhes.marca || '—'}</span></div>
                <div class="info-row"><span>Modelo</span><span>${detalhes.modelo || '—'}</span></div>
              ` : `
                <div class="info-row"><span>Tipo de Site</span><span>${detalhes.tipo_site || '—'}</span></div>
                <div class="info-row"><span>Prazo Desejado</span><span>${detalhes.prazo_desejado || '—'}</span></div>
              `}
            ` : ''}

            <h3 style="margin-top: 24px;">Anexos</h3>
            <div id="lista-anexos"><p style="color:var(--muted);">Carregando arquivos...</p></div>
          </div>

          <div class="chamado-info">
            <h3>Pagamento e Orçamento</h3>
            <div class="info-row"><span>Valor do Orçamento</span><span>${c.orcamento_valor ? 'R$ ' + c.orcamento_valor.toFixed(2).replace('.', ',') : 'Aguardando análise'}</span></div>
            <div class="info-row"><span>Situação do Pagamento</span><span>${c.status_pagamento || 'Pendente'}</span></div>
            ${c.status_pagamento === 'Pendente' && c.orcamento_valor ? `
              <button onclick="solicitarConferencia()" style="margin-top: 15px; background: var(--lime); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;">Já efetuei o pagamento</button>
            ` : ''}
          </div>
        </div>

        <div>
          <div class="chamado-info">
            <h3>Acompanhamento do Atendimento</h3>
            <ul class="timeline">${timelineHTML}</ul>
          </div>

          <div class="chat-container">
            <div class="chat-body" id="chat-body">
              <p style="text-align:center; color:var(--muted);">Carregando conversa...</p>
            </div>
            <form class="chat-footer" id="form-chat">
              <input type="text" id="input-msg" placeholder="Digite sua mensagem..." required autocomplete="off">
              <button type="submit">Enviar</button>
            </form>
          </div>
        </div>
      `;

      // Função para carregar anexos
      async function carregarAnexos() {
        const div = document.getElementById('lista-anexos');
        if (!arquivos || arquivos.length === 0) { div.innerHTML = "<p style='color:var(--muted);'>Nenhum arquivo enviado.</p>"; return; }
        
        let html = "";
        for (const arq of arquivos) {
          const { data: urlData } = await db.storage.from('anexos').createSignedUrl(arq.caminho_storage, 3600);
          if (urlData) html += `<p><a href="${urlData.signedUrl}" target="_blank" style="color: var(--lime);">📎 ${arq.nome_original}</a></p>`;
        }
        div.innerHTML = html;
      }
      carregarAnexos();

      // Função de pagamento
      window.solicitarConferencia = async () => {
        if (!confirm("Deseja avisar a equipe que você efetuou o pagamento?")) return;
        await db.from('mensagens').insert({
          chamado_id: chamadoId,
          remetente_id: idCliente,
          conteudo: "⚠️ O cliente informou que efetuou o pagamento. Aguardando conferência do administrador."
        });
        alert("Aviso enviado! A equipe irá conferir e atualizar o status.");
        await carregarChat();
      };

      // Função do Chat
      async function carregarChat() {
        const chatBody = document.getElementById('chat-body');
        const { data } = await db.from('mensagens').select('*').eq('chamado_id', chamadoId).order('criado_em', { ascending: true });
        
        if (!data || data.length === 0) {
          chatBody.innerHTML = `<p style="text-align:center; color:var(--muted);">Nenhuma mensagem ainda.</p>`;
          return;
        }

        chatBody.innerHTML = data.map(msg => {
          const isMe = msg.remetente_id === idCliente;
          const hora = new Date(msg.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          return `<div class="chat-msg ${isMe ? 'me' : ''}"><small>${isMe ? 'Você' : 'TechEmpire'} · ${hora}</small>${msg.conteudo}</div>`;
        }).join('');
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      document.getElementById('form-chat').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('input-msg');
        const texto = input.value.trim();
        if (!texto) return;

        await db.from('mensagens').insert({ chamado_id: chamadoId, remetente_id: idCliente, conteudo: texto });
        input.value = '';
        await carregarChat();
      };

      await carregarChat();
    }, 1000);
  });
</script>
</body>
</html>
