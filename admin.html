<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Administrativo — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= TEMA CLARO ================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #F8F9FA; --s1: #FFFFFF; --s2: #F3F4F6; --border: #E5E7EB; --text-main: #1F2937; --text-muted: #6B7280; --brand: #8fd21f; --brand-dark: #7ab81a; --err: #EF4444; }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }
  
  /* SIDEBAR */
  .sidebar { width: 240px; background: var(--s1); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 40px; color: var(--text-main); }
  .logo i { background: var(--brand); color: #fff; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-weight: 800; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
  .sidebar a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; font-weight: 500; color: var(--text-muted); transition: 0.2s; font-size: 14px; cursor: pointer; }
  .sidebar a:hover, .sidebar a.active { background: rgba(143, 210, 31, 0.1); color: var(--brand-dark); }
  .sidebar .sair { margin-top: auto; color: var(--err); }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; border-bottom: 1px solid var(--border); background: var(--s1); }
  .search-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; width: 350px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
  .search-box input { background: none; border: none; outline: none; color: var(--text-main); width: 100%; font-size: 13px; }
  .user-info { display: flex; align-items: center; gap: 20px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--s2); display: grid; place-items: center; border: 1px solid var(--border); }

  /* CONTEÚDO */
  .content-area { flex: 1; display: grid; grid-template-columns: 1fr 340px; overflow: hidden; }
  .main-content { padding: 32px; overflow-y: auto; display: flex; flex-direction: column; }
  
  .page-header { margin-bottom: 24px; }
  .page-header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; }
  .page-header p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

  .tela { display: none; flex-direction: column; flex: 1; }
  .tela.active { display: flex; }

  /* KANBAN E CARDS */
  .summary-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  .summary-card { background: var(--s1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .summary-card h3 { font-size: 24px; font-family: 'Space Grotesk'; color: var(--brand-dark); line-height: 1; }
  .summary-card p { font-size: 13px; color: var(--text-muted); margin: 0; }

  .kanban-board { display: flex; gap: 16px; flex: 1; overflow-x: auto; }
  .kanban-col { min-width: 260px; flex: 1; background: transparent; }
  .kanban-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; font-weight: 600; color: var(--text-main); }
  .kanban-cards { display: flex; flex-direction: column; gap: 12px; }
  .kanban-card { background: var(--s1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: 0.2s; }
  .kanban-card:hover { border-color: var(--brand); }
  .kanban-card .k-tag { font-size: 11px; color: var(--text-muted); font-family: monospace; margin-bottom: 8px; display: block; }
  .kanban-card .k-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .kanban-card .k-desc { font-size: 12px; color: var(--text-muted); }
  
  .empty-col { border: 1px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px; }

  /* TABELAS */
  .table-box { background: var(--s1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-top: 16px; width: 100%; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 16px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  tr:hover td { background: var(--s2); }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; background: rgba(143, 210, 31, 0.15); color: var(--brand-dark); }
  .btn-acao { background: var(--brand); color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 12px; transition: 0.2s; }
  .btn-acao:hover { background: var(--brand-dark); }

  /* ANOTAÇÕES */
  .sidebar-notes { background: var(--s1); border-left: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
  .notes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: 600; font-size: 15px; }
  .note-input-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
  .note-input-box textarea { width: 100%; background: transparent; border: none; color: var(--text-main); outline: none; resize: none; font-size: 13px; font-family: 'Inter'; height: 60px; margin-bottom: 12px; }
  .note-tools { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; color: var(--text-muted); }
  .btn-save-note { background: var(--brand); color: #fff; padding: 6px 16px; border-radius: 6px; font-weight: 600; font-size: 12px; }

  /* MODAL */
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-box { background: var(--s1); border: 1px solid var(--border); border-radius: 16px; width: 95%; max-width: 500px; padding: 32px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
  .modal-box h2 { font-family: 'Space Grotesk'; color: var(--text-main); font-size: 20px; margin-bottom: 8px;}
  .form-group label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 600;}
  .form-group input, .form-group select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); outline: none; }
  .modal-actions { display: flex; justify-content: space-between; margin-top: 16px; gap: 10px;}
  .btn-modal { padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .btn-modal.primary { background: var(--brand); color: #fff; }
  .btn-modal.danger { background: var(--err); color: #fff; }
  .btn-modal.secondary { background: var(--s1); border: 1px solid var(--border); color: var(--text-main); }

  /* RESPONSIVO */
  @media (max-width: 1000px) { .content-area { grid-template-columns: 1fr; } .sidebar-notes { display: none; } }
</style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html" class="logo"><i>TE</i><span>Tech<b>Empire</b></span></a>
    <nav>
      <a id="nav-inicio" class="active" onclick="mudarAba('inicio')">🏠 Início</a>
      <a id="nav-chamados" onclick="mudarAba('chamados')">🎫 Chamados</a>
      <a id="nav-clientes" onclick="mudarAba('clientes')">👥 Clientes</a>
      <a href="login.html" class="sair">🚪 Sair</a>
    </nav>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="search-box"><span>🔍</span><input type="text" placeholder="Buscar..."></div>
      <div class="user-info">
        <div class="avatar">👤</div>
        <div><div style="font-size: 13px; font-weight: 600;">Administrador</div></div>
      </div>
    </div>

    <div class="content-area">
      <div class="main-content">
        <div class="page-header">
          <h1 id="page-title">Organização</h1>
          <p id="page-desc">Gerencie os projetos.</p>
        </div>

        <!-- TELA INÍCIO (KANBAN) -->
        <div id="tela-inicio" class="tela active">
          <div class="summary-cards">
            <div class="summary-card"><h3 id="sum-novos">0</h3><p>Novos pedidos</p></div>
            <div class="summary-card"><h3 id="sum-execucao">0</h3><p>Em execução</p></div>
            <div class="summary-card"><h3 id="sum-aguardando">0</h3><p>Aguardando cliente</p></div>
            <div class="summary-card"><h3 id="sum-concluidos">0</h3><p>Concluídos</p></div>
          </div>
          <div class="kanban-board" id="kanban-board"></div>
        </div>

        <!-- TELA CHAMADOS -->
        <div id="tela-chamados" class="tela">
          <div class="table-box">
            <table><thead><tr><th>Protocolo</th><th>Cliente</th><th>Status</th></tr></thead><tbody id="tabela-chamados-body"></tbody></table>
          </div>
        </div>

        <!-- TELA CLIENTES -->
        <div id="tela-clientes" class="tela">
          <div class="table-box">
            <table><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th></tr></thead><tbody id="tabela-clientes-body"></tbody></table>
          </div>
        </div>
      </div>

      <!-- ANOTAÇÕES -->
      <div class="sidebar-notes">
        <div class="notes-header"><span>📝 Anotações</span></div>
        <div class="note-input-box">
          <textarea id="note-text" placeholder="Digite sua anotação..."></textarea>
          <div class="note-tools">
            <button class="btn-save-note" onclick="salvarAnotacao()">Salvar</button>
          </div>
        </div>
        <div id="notes-list"></div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="modal-chamado">
    <div class="modal-box">
      <h2>Gerenciar Chamado</h2>
      <input type="hidden" id="edit-id">
      <div class="form-group"><label>Cliente</label><input type="text" id="edit-cliente" disabled style="opacity: 0.6;"></div>
      <div class="form-group">
        <label>Status</label>
        <select id="edit-status">
          <option value="Nova chamada">Nova chamada</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Aguardando aprovação do orçamento">Aguardando cliente</option>
          <option value="Concluída">Concluída</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-modal danger" onclick="excluirChamado()">Excluir</button>
        <div style="display: flex; gap: 10px;">
          <button class="btn-modal secondary" onclick="fecharModal()">Cancelar</button>
          <button class="btn-modal primary" onclick="salvarChamado()">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    let chamados = [], clientes = [], idAdmin = null;

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }
      idAdmin = session.user.id;
      await carregarDados();
      mudarAba('inicio');
    }

    async function carregarDados() {
      const { data: c } = await db.from("chamados").select("*").order("criado_em", { ascending: false });
      chamados = c || [];
      const { data: cl } = await db.from("usuarios").select("*").eq("is_admin", false);
      clientes = cl || [];
      renderizarKanban();
      renderizarTabelas();
    }

    function mudarAba(aba) {
      document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
      document.getElementById('nav-' + aba).classList.add('active');
      document.querySelectorAll('.tela').forEach(t => t.classList.remove('active'));
      document.getElementById('tela-' + aba).classList.add('active');

      if (aba === 'inicio') { document.getElementById('page-title').textContent = 'Organização'; renderizarKanban(); }
      if (aba === 'chamados') { document.getElementById('page-title').textContent = 'Chamados'; renderizarTabelas(); }
      if (aba === 'clientes') { document.getElementById('page-title').textContent = 'Clientes'; renderizarTabelas(); }
    }

    function renderizarKanban() {
      const novos = chamados.filter(c => c.status === 'Nova chamada').length;
      const exec = chamados.filter(c => c.status === 'Em andamento').length;
      const aguard = chamados.filter(c => c.status === 'Aguardando aprovação do orçamento').length;
      const concl = chamados.filter(c => c.status === 'Concluída').length;

      document.getElementById('sum-novos').textContent = novos;
      document.getElementById('sum-execucao').textContent = exec;
      document.getElementById('sum-aguardando').textContent = aguard;
      document.getElementById('sum-concluidos').textContent = concl;

      const cols = [
        { id: 'Nova chamada', title: 'Novos pedidos' },
        { id: 'Em andamento', title: 'Em execução' },
        { id: 'Aguardando', title: 'Aguardando cliente' },
        { id: 'Concluída', title: 'Concluídos' }
      ];

      let html = '';
      cols.forEach(col => {
        let filtrados = col.id === 'Aguardando' ? chamados.filter(c => c.status === 'Aguardando aprovação do orçamento') : chamados.filter(c => c.status === col.id);
        html += `<div class="kanban-col"><div class="kanban-header">${col.title} (${filtrados.length})</div><div class="kanban-cards">`;
        if (filtrados.length === 0) html += `<div class="empty-col">Nenhum projeto.</div>`;
        else {
          filtrados.forEach(c => {
            html += `<div class="kanban-card" onclick="abrirModal('${c.id}')">
              <span class="k-tag">${c.protocolo || 'S/N'}</span>
              <div class="k-title">${c.cliente_nome || 'Visitante'}</div>
              <div class="k-desc">${c.titulo || 'Sem descrição'}</div>
            </div>`;
          });
        }
        html += `</div></div>`;
      });
      document.getElementById('kanban-board').innerHTML = html;
    }

    function renderizarTabelas() {
      let htmlC = '';
      chamados.forEach(c => {
        htmlC += `<tr><td>${c.protocolo || 'S/N'}</td><td>${c.cliente_nome || 'Visitante'}</td><td><span class="pill">${c.status}</span></td></tr>`;
      });
      document.getElementById('tabela-chamados-body').innerHTML = htmlC;

      let htmlU = '';
      clientes.forEach(c => {
        htmlU += `<tr><td>${c.nome}</td><td>${c.email}</td><td>${c.telefone || '—'}</td></tr>`;
      });
      document.getElementById('tabela-clientes-body').innerHTML = htmlU;
    }

    function abrirModal(id) {
      const c = chamados.find(x => x.id === id);
      document.getElementById('edit-id').value = c.id;
      document.getElementById('edit-cliente').value = c.cliente_nome || 'Visitante';
      document.getElementById('edit-status').value = c.status;
      document.getElementById('modal-chamado').style.display = 'flex';
    }

    async function salvarChamado() {
      const id = document.getElementById('edit-id').value;
      const status = document.getElementById('edit-status').value;
      await db.from("chamados").update({ status }).eq("id", id);
      fecharModal();
      await carregarDados();
    }

    async function excluirChamado() {
      const id = document.getElementById('edit-id').value;
      if (!confirm("Excluir?")) return;
      await db.from("chamados").delete().eq("id", id);
      fecharModal();
      await carregarDados();
    }

    async function salvarAnotacao() {
      const texto = document.getElementById('note-text').value.trim();
      if (!texto) return;
      await db.from('anotacoes').insert({ admin_id: idAdmin, texto });
      document.getElementById('note-text').value = '';
      carregarAnotacoes();
    }

    async function carregarAnotacoes() {
      const { data } = await db.from('anotacoes').select('*').order('criado_em', { ascending: false });
      document.getElementById('notes-list').innerHTML = data.length ? data.map(n => `<div style="background:#F8F9FA; border-left:3px solid #8fd21f; padding:12px; margin-bottom:8px; border-radius:6px; font-size:13px;">${n.texto}</div>`).join('') : '<p style="font-size:12px; color:#6B7280;">Nenhuma anotação.</p>';
    }

    function fecharModal() { document.getElementById('modal-chamado').style.display = 'none'; }

    init();
  </script>
</body>
</html>
