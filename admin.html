<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Administrativo — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= ESTÉTICA PREMIUM ================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07090b;
    --s1: rgba(18, 21, 24, 0.7);
    --s2: rgba(26, 29, 33, 0.8);
    --s3: rgba(30, 34, 39, 0.9);
    --line: rgba(255, 255, 255, 0.08);
    --line2: rgba(255, 255, 255, 0.15);
    --ink: #FFFFFF;
    --muted: #9ba1a6;
    --turquesa: #00DDB5;
    --err: #ff7b6b;
  }
  body { 
    background: var(--bg); font-family: 'Inter', sans-serif; color: var(--ink); display: flex; height: 100vh; overflow: hidden;
    background-image: radial-gradient(ellipse at 50% -20%, rgba(0, 221, 181, 0.15), transparent 50%), linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
  }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; font-family: inherit; border: none; }
  
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-in { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }

  /* SIDEBAR */
  .sidebar { width: 260px; background: var(--s1); backdrop-filter: blur(20px); border-right: 1px solid var(--line); padding: 30px 24px; display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 12px; font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 40px; }
  .logo i { background: var(--turquesa); color: #000; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-style: normal; box-shadow: 0 0 20px rgba(0, 221, 181, 0.4); }
  .logo b { color: var(--turquesa); }
  .sidebar nav { display: flex; flex-direction: column; gap: 6px; }
  .sidebar a { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 12px; font-weight: 500; color: var(--muted); transition: 0.3s; cursor: pointer; font-size: 15px; border: 1px solid transparent; }
  .sidebar a:hover { color: var(--ink); background: rgba(255,255,255,0.03); }
  .sidebar a.active { background: rgba(0, 221, 181, 0.1); color: var(--turquesa); border-color: rgba(0, 221, 181, 0.2); box-shadow: inset 0 0 20px rgba(0,221,181,0.05); }
  .sidebar .sair { margin-top: auto; color: var(--err); border-top: 1px solid var(--line); border-radius: 0; padding-top: 24px; }
  
  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--line); background: var(--s1); backdrop-filter: blur(20px); }
  .search-bar { background: rgba(0,0,0,0.3); border: 1px solid var(--line2); border-radius: 99px; padding: 12px 24px; color: var(--ink); width: 300px; outline: none; transition: 0.3s; }
  .search-bar:focus { border-color: var(--turquesa); box-shadow: 0 0 0 3px rgba(0,221,181,0.1); }
  .user-info { display: flex; align-items: center; gap: 16px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--turquesa); color: #000; display: grid; place-items: center; font-weight: 800; font-size: 18px; }

  .content { flex: 1; display: grid; grid-template-columns: 1fr 400px; gap: 30px; padding: 40px; overflow-y: auto; }
  .dashboard-area { display: flex; flex-direction: column; gap: 30px; }
  
  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .kpi { background: var(--s2); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 20px; padding: 24px; position: relative; overflow: hidden; transition: transform 0.3s; }
  .kpi:hover { transform: translateY(-4px); border-color: var(--line2); }
  .kpi::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--turquesa), transparent); opacity: 0.8; }
  .kpi h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; font-weight: 600; }
  .kpi b { font-family: 'Montserrat', sans-serif; font-size: 38px; color: var(--ink); line-height: 1; }

  /* Tabela */
  .table-box { background: var(--s2); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
  .table-header { padding: 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .table-header h3 { font-family: 'Montserrat', sans-serif; font-size: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 16px 24px; font-size: 12px; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--line); letter-spacing: 1px; }
  td { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 15px; vertical-align: middle; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .pill { background: rgba(0, 221, 181, 0.1); color: var(--turquesa); padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 600; border: 1px solid rgba(0, 221, 181, 0.2); display: inline-block; }
  .btn-acao { background: var(--turquesa); color: #000; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 13px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 221, 181, 0.2); }
  .btn-acao:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 221, 181, 0.4); background: #00F5C8; }
  .btn-sec { background: rgba(255,255,255,0.05); color: var(--ink); padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; border: 1px solid var(--line2); transition: 0.3s; }
  .btn-sec:hover { background: rgba(255,255,255,0.1); }

  /* CHAT LATERAL */
  .chat-sidebar { background: var(--s2); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 24px; display: flex; flex-direction: column; height: calc(100vh - 160px); position: sticky; top: 40px; }
  .chat-header { padding: 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; background: var(--s3); border-radius: 24px 24px 0 0; }
  .chat-header h4 { font-family: 'Montserrat', sans-serif; font-size: 16px; }
  .chat-header span { color: var(--turquesa); font-size: 12px; font-weight: 600; }
  .chat-body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  .chat-msg { padding: 14px 20px; border-radius: 16px; font-size: 14px; max-width: 90%; line-height: 1.5; }
  .chat-msg small { display: block; font-size: 10px; opacity: 0.7; margin-bottom: 4px; }
  .chat-msg.ou { background: var(--s3); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--line); }
  .chat-msg.me { background: var(--turquesa); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; }
  .chat-footer { padding: 20px; border-top: 1px solid var(--line); display: flex; gap: 12px; background: var(--s3); border-radius: 0 0 24px 24px; }
  .chat-footer input { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--line2); background: rgba(0,0,0,0.3); color: var(--ink); outline: none; transition: 0.3s; }
  .chat-footer input:focus { border-color: var(--turquesa); }
  .chat-footer button { background: var(--turquesa); color: #000; padding: 0 24px; border-radius: 12px; font-weight: 700; transition: 0.3s; }
  .chat-footer button:hover { background: #00F5C8; }

  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background:
