<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Administrativo — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { background: #06080a !important; margin: 0; font-family: 'Inter', sans-serif; color: #ffffff !important; display: flex; height: 100vh; overflow: hidden; }
  h1, h2, h3, h4, p, span, div, td, th, a { color: #ffffff !important; }
  
  .sidebar { width: 260px; background: #0a0d0f !important; border-right: 1px solid #222; padding: 24px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: bold; margin-bottom: 40px; }
  .logo i { background: #b4f03c; color: #000 !important; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-style: normal; }
  .logo b { color: #b4f03c !important; }
  .sidebar a { display: flex; align-items: center; gap: 10px; padding: 12px 16px; text-decoration: none; border-radius: 8px; font-weight: 500; margin-bottom: 6px; cursor: pointer; font-size: 15px; color: #d1d5db !important; }
  .sidebar a:hover, .sidebar a.active { background: rgba(180,240,60,0.1) !important; color: #b4f03c !important; }
  .sidebar .voltar { color: #97a0a6 !important; margin-bottom: 15px; }
  .sidebar .sair { margin-top: auto; color: #ff7b6b !important; border-top: 1px solid #222; padding-top: 20px; }

  .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #222; background: #0a0d0f !important; position: sticky; top: 0; z-index: 10; }
  .topbar h1 { margin: 0; font-size: 20px; font-family: 'Space Grotesk', sans-serif; }
  
  .content { padding: 40px; display: grid; grid-template-columns: 1fr 380px; gap: 30px; align-items: start; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
  .kpi { background: #12161a !important; border: 1px solid #333; padding: 20px; border-radius: 12px; }
  .kpi h3 { margin: 0 0 10px 0; font-size: 12px; color: #d1d5db !important; text-transform: uppercase; }
  .kpi b { font-size: 32px; font-family: 'Space Grotesk', sans-serif; color: #b4f03c !important; display: block; }
  
  .box { background: #12161a !important; border: 1px solid #333; border-radius: 12px; padding: 24px; }
  .box h3 { margin: 0 0 20px 0; font-size: 18px; }
  
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 12px; font-size: 12px; color: #b4f03c !important; border-bottom: 1px solid #333; text-transform: uppercase; }
  td { padding: 15px 12px; border-bottom: 1px solid #222; font-size: 14px; cursor: pointer; }
  tr:hover td { background: rgba(255,255,255,0.05); }
  .pill { background: rgba(180,240,60,0.15) !important; color: #b4f03c !important; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: bold; border: 1px solid rgba(180,240,60,0.3); }

  .chat-panel { background: #12161a !important; border: 1px solid #333; border-radius: 12px; display: flex; flex-direction: column; height: 600px; position: sticky; top: 100px; }
  .chat-header { padding: 15px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; background: #1a1e22 !important; }
  .chat-body { padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0a0d0f !important; }
  .chat-msg { background: #1a1e22 !important; padding: 10px 15px; border-radius: 12px; font-size: 14px; max-width: 90%; border-bottom-left-radius: 2px; }
  .chat-msg.me { background: #b4f03c !important; color: #000 !important; align-self: flex-end; border-bottom-left-radius: 12px; border-bottom-right-radius: 2px; }
  .chat-msg small { display: block; font-size: 10px; opacity: 0.8; margin-bottom: 4px; color: inherit !important; }
  .chat-footer { padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; background: #1a1e22 !important; }
  .chat-footer input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #06080a !important; color: #fff !important; outline: none; }
  .chat-footer button { background: #b4f03c !important; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000 !important; }

  .modal-full { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
  .modal-box { background: #0e1114 !important; border: 1px solid #333; border-radius: 16px; width: 90%; max-width: 1100px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .modal-header { padding: 20px 30px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; background: #12161a; }
  .modal-header h2 { margin: 0; color: #fff !important; font-size: 22px; }
  .btn-close { background: none; border: none; color: #fff !important; font-size: 24px; cursor: pointer; }
  .modal-body-grid { display: grid; grid-template-columns: 1fr 1fr; flex: 1; overflow: hidden; }
  .modal-left { padding: 30px; overflow-y: auto; border-right: 1px solid #333; }
  .modal-right { display: flex; flex-direction: column; background: #0a0d0f; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 13px; font-weight: bold; color: #b4f03c !important; margin-bottom: 8px; text-transform: uppercase; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: #06080a; border: 1px solid #444; border-radius: 8px; color: #fff; font-family: inherit; }
  .form-group textarea { resize: vertical; min-height: 100px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn-acao { padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .btn-acao.salvar { background: #b4f03c !important; color: #000 !important; }
  .btn-acao.excluir { background: #ff7b6b !important; color: #fff !important; }
</style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html" class="logo"><i>TE</i><span>Tech<b>Empire</b></span></a>
    <a href="index.html" class="voltar">← Voltar ao site</a>
    <a class="active" id="menu-inicio">📊 Visão Geral</a>
    <a id="menu-chamados">🎫 Chamados</a>
    <a id="menu-clientes">👥 Clientes</a>
    <a href="login.html" class="sair">Sair da conta</a>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>Visão Geral</h1>
        <span style="color: #d1d5db; font-size: 14px;">Acompanhe as métricas e chamados.</span>
      </div>
    </div>

    <div class="content">
      <div id="area-principal">
        <div class="kpis" id="admin-kpis"></div>
        <div class="box">
          <h3>Chamados</h3>
          <div id="tabela-conteudo"></div>
        </div>
      </div>

      <div class="chat-panel" id="painel-chat" style="display: flex;">
        <div class="chat-header">
          <div style="width: 30px; height: 30px; font-size: 14px; background: #b4f03c; color: #000 !important; border-radius: 50%; display: grid; place-items: center;">👤</div>
          <div>
            <h4 id="chat-titulo" style="margin:0;">Selecione um chamado</h4>
            <span id="chat-status" style="color: #b4f03c !important; font-size: 12px;">Aguardando...</span>
          </div>
        </div>
        <div class="chat-body" id="chat-mensagens">
          <p style="text-align: center; margin-top: 20px;">Clique em "Abrir" na tabela para conversar.</p>
        </div>
        <form class="chat-footer" id="form-chat" style="display: none;">
          <input type="text" id="input-msg" placeholder="Digite sua resposta..." required autocomplete="off">
          <button type="submit" id="btn-enviar">Enviar</button>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-full" id="modal-full">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-titulo">Chamado</h2>
        <button class="btn-close" onclick="fecharModal()">✕</button>
      </div>
      <div class="modal-body-grid">
        <div class="modal-left">
          <div class="form-group">
            <label>Título</label>
            <input type="text" id="edit-titulo">
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea id="edit-descricao" rows="5"></textarea>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="edit-status">
              <option value="Nova chamada">Nova chamada</option>
              <option value="Aguardando análise">Aguardando análise</option>
              <option value="Em andamento">Em andamento</option>
              <option value="Concluída">Concluída</option>
              <option value="Cancelada">Cancelada</option>
            </select>
          </div>
          <div class="modal-actions">
            <button class="btn-acao salvar" onclick="salvarEdicao()">💾 Salvar</button>
            <button class="btn-acao excluir" onclick="excluirChamado()">🗑️ Excluir</button>
          </div>
        </div>
        <div class="modal-right">
          <div class="chat-header" style="border-top: none; display:flex; padding: 15px; gap:10px; background:#12161a;">
            <div style="width: 30px; height: 30px; font-size: 14px; background: #b4f03c; color: #000 !important; border-radius: 50%; display: grid; place-items: center;">👤</div>
            <div><h4 style="margin:0;">Conversa</h4></div>
          </div>
          <div class="chat-body" id="chat-modal-mensagens" style="flex: 1; padding: 15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;">
            <p style="text-align:center; margin-top:20px; color:#97a0a6;">Carregando...</p>
          </div>
          <form class="chat-footer" id="form-chat-modal" style="display: flex;">
            <input type="text" id="input-msg-modal" placeholder="Digite sua resposta..." required autocomplete="off">
            <button type="submit" id="btn-enviar-modal">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    let idAdmin = null;
    let chamadoAbertoId = null;

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }
      idAdmin = session.user.id;
      carregarChamados();
    }

    async function carregarChamados() {
      const { data: chamados, error } = await db.from("chamados").select("*").order("criado_em", { ascending: false });
      
      if (error) {
        document.getElementById("tabela-conteudo").innerHTML = `<p style="color: red;">Erro ao carregar: ${error.message}</p>`;
        return;
      }

      document.getElementById("admin-kpis").innerHTML = `
        <div class="kpi"><h3>Total</h3><b>${chamados ? chamados.length : 0}</b></div>
        <div class="kpi"><h3>Novos</h3><b>${chamados ? chamados.filter(c => c.status === 'Nova chamada').length : 0}</b></div>
        <div class="kpi"><h3>Andamento</h3><b>${chamados ? chamados.filter(c => c.status === 'Em andamento').length : 0}</b></div>
        <div class="kpi"><h3>Concluídos</h3><b>${chamados ? chamados.filter(c => c.status === 'Concluída').length : 0}</b></div>
      `;

      if (chamados && chamados.length > 0) {
        let html = `<table><thead><tr><th>Nº</th><th>Título</th><th>Status</th><th>Ação</th></tr></thead><tbody>`;
        chamados.forEach(c => {
          html += `<tr>
            <td>TE-${String(c.numero).padStart(6, '0')}</td>
            <td>${c.titulo}</td>
            <td><span class="pill">${c.status}</span></td>
            <td><button onclick="abrirChamado('${c.id}')" style="background:#b4f03c; color:#000 !important; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;">Abrir</button></td>
          </tr>`;
        });
        html += `</tbody></table>`;
        document.getElementById("tabela-conteudo").innerHTML = html;
      } else {
        document.getElementById("tabela-conteudo").innerHTML = "<p>Nenhum chamado encontrado.</p>";
      }
    }

    async function abrirChamado(id) {
      chamadoAbertoId = id;
      const { data: c } = await db.from("chamados").select("*").eq("id", id).single();
      if (!c) return;

      document.getElementById('modal-titulo').textContent = `Chamado TE-${String(c.numero).padStart(6, '0')}`;
      document.getElementById('edit-titulo').value = c.titulo;
      document.getElementById('edit-descricao').value = c.descricao;
      document.getElementById('edit-status').value = c.status;
      document.getElementById('modal-full').style.display = 'flex';
      
      await carregarMensagensModal(id);
    }

    function fecharModal() {
      document.getElementById('modal-full').style.display = 'none';
      chamadoAbertoId = null;
    }

    async function salvarEdicao() {
      if (!chamadoAbertoId) return;
      await db.from("chamados").update({ 
        titulo: document.getElementById('edit-titulo').value, 
        descricao: document.getElementById('edit-descricao').value, 
        status: document.getElementById('edit-status').value 
      }).eq("id", chamadoAbertoId);
      alert("Chamado atualizado!");
      carregarChamados();
    }

    async function excluirChamado() {
      if (!chamadoAbertoId || !confirm("Excluir chamado?")) return;
      await db.from("chamados").delete().eq("id", chamadoAbertoId);
      fecharModal(); carregarChamados();
    }

    async function carregarMensagensModal(chamadoId) {
      const chatBody = document.getElementById('chat-modal-mensagens');
      const { data } = await db.from('mensagens').select('*').eq('chamado_id', chamadoId).order('criado_em', { ascending: true });
      
      if (!data || data.length === 0) {
        chatBody.innerHTML = `<p style="text-align:center; color:#97a0a6;">Nenhuma mensagem.</p>`;
        return;
      }

      chatBody.innerHTML = data.map(msg => {
        const isMe = msg.remetente_id === idAdmin;
        const hora = new Date(msg.criado_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        return `<div class="chat-msg ${isMe ? 'me' : ''}"><small>${isMe ? 'Você' : 'Cliente'} · ${hora}</small>${msg.conteudo}</div>`;
      }).join('');
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    document.getElementById('form-chat-modal').onsubmit = async (e) => {
      e.preventDefault();
      if (!chamadoAbertoId) return;
      const input = document.getElementById('input-msg-modal');
      const texto = input.value.trim();
      if (!texto) return;

      const { error } = await db.from('mensagens').insert({
        chamado_id: chamadoAbertoId,
        remetente_id: idAdmin,
        conteudo: texto
      });

      if (error) alert("Erro: " + error.message);
      else { input.value = ''; await carregarMensagensModal(chamadoAbertoId); }
    };

    init();
  </script>
</body>
</html>
