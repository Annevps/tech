<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Admin — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body { background: #06080a !important; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
  .container { width: 100%; max-width: 1000px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 32px; }
  .box { background: #12161a; border: 1px solid #333; border-radius: 12px; padding: 24px; margin-top: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th { text-align: left; padding: 12px; color: #b4f03c; border-bottom: 1px solid #333; text-transform: uppercase; font-size: 12px;}
  td { padding: 15px 12px; border-bottom: 1px solid #222; }
  button { background: #b4f03c; color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  
  /* Modal do chat */
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
  .modal-box { background: #12161a; border: 1px solid #333; width: 90%; max-width: 800px; border-radius: 12px; display: flex; flex-direction: column; height: 80vh; }
  .modal-header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
  .modal-header h2 { margin: 0; font-size: 20px; }
  .btn-close { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
  
  .chat-container { display: flex; flex-direction: column; flex: 1; overflow: hidden; background: #0a0d0f; }
  .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .chat-msg { background: #1a1e22; padding: 12px 18px; border-radius: 12px; font-size: 14px; max-width: 80%; border-bottom-left-radius: 2px; align-self: flex-start; }
  .chat-msg.me { background: #b4f03c; color: #000; align-self: flex-end; border-bottom-left-radius: 12px; border-bottom-right-radius: 2px; }
  .chat-msg small { display: block; font-size: 10px; opacity: 0.7; margin-bottom: 4px; }
  .chat-footer { padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; background: #12161a; }
  .chat-footer input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #06080a; color: #fff; outline: none; }
  .chat-footer button { background: #b4f03c; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
</style>
</head>
<body>
<div class="container">
  <h1>Painel Administrativo</h1>
  <p style="color: #97a0a6;">Gerencie os chamados e converse com os clientes.</p>
  
  <div class="box">
    <h3>Chamados Recebidos</h3>
    <div id="tabela-chamados"><p>Carregando...</p></div>
  </div>
</div>

<!-- Modal do Chat -->
<div class="modal" id="modal-chat">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modal-titulo">Conversa</h2>
      <button class="btn-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="chat-container">
      <div class="chat-body" id="chat-body-admin"><p>Carregando...</p></div>
      <form class="chat-footer" id="form-chat-admin">
        <input type="text" id="input-msg-admin" placeholder="Digite sua resposta..." required>
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
  let idAdmin = null;
  let chamadoAbertoId = null;

  async function init() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    idAdmin = session.user.id;

    const { data: chamados } = await db.from("chamados").select("*").order("criado_em", { ascending: false });
    
    if (!chamados || chamados.length === 0) {
      document.getElementById('tabela-chamados').innerHTML = '<p>Nenhum chamado encontrado.</p>';
      return;
    }

    let html = `<table><thead><tr><th>Nº</th><th>Título</th><th>Status</th><th>Ação</th></tr></thead><tbody>`;
    chamados.forEach(c => {
      html += `<tr>
        <td>TE-${String(c.numero).padStart(6, '0')}</td>
        <td>${c.titulo}</td>
        <td>${c.status}</td>
        <td><button onclick="abrirChat('${c.id}', '${c.titulo}')">Abrir Chat</button></td>
      </tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById('tabela-chamados').innerHTML = html;
  }

  async function abrirChat(id, titulo) {
    chamadoAbertoId = id;
    document.getElementById('modal-titulo').textContent = `Conversa: ${titulo}`;
    document.getElementById('modal-chat').style.display = 'flex';
    await carregarMensagens(id);
  }

  function fecharModal() {
    document.getElementById('modal-chat').style.display = 'none';
    chamadoAbertoId = null;
  }

  async function carregarMensagens(chamadoId) {
    const chatBody = document.getElementById('chat-body-admin');
    const { data } = await db.from('mensagens').select('*').eq('chamado_id', chamadoId).order('criado_em', { ascending: true });
    
    if (!data || data.length === 0) {
      chatBody.innerHTML = `<p style="color:#97a0a6; text-align:center;">Nenhuma mensagem ainda.</p>`;
      return;
    }

    chatBody.innerHTML = data.map(msg => {
      const isMe = msg.remetente_id === idAdmin;
      return `<div class="chat-msg ${isMe ? 'me' : ''}"><small>${isMe ? 'Você (Admin)' : 'Cliente'}</small>${msg.conteudo}</div>`;
    }).join('');
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  document.getElementById('form-chat-admin').onsubmit = async (e) => {
    e.preventDefault();
    if (!chamadoAbertoId) return;
    const input = document.getElementById('input-msg-admin');
    const texto = input.value.trim();
    if (!texto) return;

    const { error } = await db.from('mensagens').insert({ chamado_id: chamadoAbertoId, remetente_id: idAdmin, conteudo: texto });
    if (error) { alert("Erro ao enviar: " + error.message); } 
    else { input.value = ''; await carregarMensagens(chamadoAbertoId); }
  };

  init();
</script>
</body>
</html>
