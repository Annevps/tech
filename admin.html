<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Administrativo — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= TEMA CLARO ================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F8F9FA; --s1: #FFFFFF; --s2: #F3F4F6;
    --border: #E5E7EB; --text-main: #1F2937; --text-muted: #6B7280;
    --brand: #8fd21f; --brand-dark: #7ab81a; --err: #EF4444;
  }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }
  
  .sidebar { width: 240px; background: var(--s1); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 40px; color: var(--text-main); }
  .logo i { background: var(--brand); color: #fff; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-weight: 800; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
  .sidebar a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; font-weight: 500; color: var(--text-muted); transition: 0.2s; font-size: 14px; cursor: pointer; }
  .sidebar a:hover, .sidebar a.active { background: rgba(143, 210, 31, 0.1); color: var(--brand-dark); }
  .sidebar .sair { margin-top: auto; color: var(--err); }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; border-bottom: 1px solid var(--border); background: var(--s1); }
  .search-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; width: 350px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
  .search-box input { background: none; border: none; outline: none; color: var(--text-main); width: 100%; font-size: 13px; }
  .user-info { display: flex; align-items: center; gap: 20px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--s2); display: grid; place-items: center; border: 1px solid var(--border); }

  .content-area { flex: 1; display: grid; grid-template-columns: 1fr 340px; overflow: hidden; }
  .main-content { padding: 32px; overflow-y: auto; display: flex; flex-direction: column; }
  
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .page-header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; }
  .page-header p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  .btn-new { background: var(--brand); color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
  .btn-new:hover { background: var(--brand-dark); }

  .tela { display: none; flex-direction: column; flex: 1; }
  .tela.active { display: flex; }

  /* TABELAS */
  .table-box { background: var(--s1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-top: 16px; width: 100%; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 16px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  tr:hover td { background: var(--s2); }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; background: rgba(143, 210, 31, 0.15); color: var(--brand-dark); }
  .btn-acao { background: var(--brand); color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 12px; transition: 0.2s; }

  /* ANOTAÇÕES */
  .sidebar-notes { background: var(--s1); border-left: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
  .notes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: 600; font-size: 15px; }
  .note-input-box { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
  .note-input-box textarea { width: 100%; background: transparent; border: none; color: var(--text-main); outline: none; resize: none; font-size: 13px; font-family: 'Inter'; height: 60px; margin-bottom: 12px; }
  .btn-save-note { background: var(--brand); color: #fff; padding: 6px 16px; border-radius: 6px; font-weight: 600; font-size: 12px; }

  /* MODAIS */
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-box { background: var(--s1); border: 1px solid var(--border); border-radius: 16px; width: 95%; max-width: 600px; padding: 32px; display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
  .modal-box h2 { font-family: 'Space Grotesk'; color: var(--text-main); font-size: 20px; margin-bottom: 8px;}
  .form-group { margin-bottom: 8px; }
  .form-group label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 600;}
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); outline: none; font-family: 'Inter';}
  .form-group input:focus, .form-group textarea:focus { border-color: var(--brand); background: #fff; }
  .modal-actions { display: flex; justify-content: space-between; margin-top: 16px; gap: 10px;}
  .btn-modal { padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .btn-modal.primary { background: var(--brand); color: #fff; }
  .btn-modal.danger { background: var(--err); color: #fff; }
  .btn-modal.secondary { background: var(--s1); border: 1px solid var(--border); color: var(--text-main); }
</style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html" class="logo"><i>TE</i><span>Tech<b>Empire</b></span></a>
    <nav>
      <a id="nav-inicio" onclick="mudarAba('inicio')">🏠 Início</a>
      <a id="nav-chamados" class="active" onclick="mudarAba('chamados')">🎫 Chamados</a>
      <a id="nav-clientes" onclick="mudarAba('clientes')">👥 Clientes</a>
      <a href="login.html" class="sair">🚪 Sair da conta</a>
    </nav>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="search-box"><span>🔍</span><input type="text" placeholder="Buscar..."></div>
      <div class="user-info">
        <div class="avatar">👤</div>
        <div><div style="font-size: 13px; font-weight: 600;">Administrador</div></div>
      </div>
    </div>

    <div class="content-area">
      <div class="main-content">
        
        <div class="page-header">
          <div>
            <h1 id="page-title">Chamados</h1>
            <p id="page-desc">Gerencie todos os chamados.</p>
          </div>
          <button class="btn-new" id="btn-novo-chamado" onclick="abrirNovoChamado()">+ Novo Chamado</button>
        </div>

        <!-- TELA: CHAMADOS -->
        <div id="tela-chamados" class="tela active">
          <div class="table-box">
            <table>
              <thead><tr><th>Protocolo</th><th>Cliente</th><th>Assunto</th><th>Status</th><th>Ações</th></tr></thead>
              <tbody id="tabela-chamados-body"></tbody>
            </table>
          </div>
        </div>

        <!-- TELA: CLIENTES -->
        <div id="tela-clientes" class="tela">
          <div class="table-box">
            <table>
              <thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Data de Cadastro</th></tr></thead>
              <tbody id="tabela-clientes-body"></tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- ANOTAÇÕES -->
      <div class="sidebar-notes">
        <div class="notes-header"><span>📝 Anotações</span></div>
        <div class="note-input-box">
          <textarea id="note-text" placeholder="Digite sua anotação..."></textarea>
          <div style="display: flex; justify-content: flex-end;">
            <button class="btn-save-note" onclick="salvarAnotacao()">Salvar</button>
          </div>
        </div>
        <div id="notes-list"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: GERENCIAR CHAMADO -->
  <div class="modal" id="modal-chamado">
    <div class="modal-box">
      <h2>Gerenciar Chamado</h2>
      <input type="hidden" id="edit-id">
      <div class="form-group"><label>Cliente</label><input type="text" id="edit-cliente" disabled style="opacity: 0.6;"></div>
      <div class="form-group">
        <label>Status</label>
        <select id="edit-status">
          <option value="Nova chamada">Nova chamada</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Aguardando aprovação do orçamento">Aguardando cliente</option>
          <option value="Concluída">Concluída</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-modal danger" onclick="excluirChamado()">Excluir</button>
        <div style="display: flex; gap: 10px;">
          <button class="btn-modal secondary" onclick="fecharModal('modal-chamado')">Cancelar</button>
          <button class="btn-modal primary" onclick="salvarChamado()">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: NOVO CHAMADO -->
  <div class="modal" id="modal-novo">
    <div class="modal-box">
      <h2>Novo Chamado Presencial</h2>
      <form id="form-novo">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group"><label>Nome do Cliente *</label><input name="nome" required></div>
          <div class="form-group"><label>Telefone *</label><input name="telefone" required></div>
        </div>
        <div class="form-group"><label>E-mail</label><input name="email" type="email"></div>
        <div class="form-group">
          <label>Tipo de Serviço</label>
          <select name="categoria">
            <option value="Manutenção de Computador">Manutenção de Computador</option>
            <option value="Assistência para Celular">Assistência para Celular</option>
            <option value="Suporte Técnico">Suporte Técnico</option>
            <option value="Criação de Site">Criação de Site</option>
          </select>
        </div>
        <div class="form-group"><label>Assunto *</label><input name="titulo" required placeholder="Resuma o problema"></div>
        <div class="form-group"><label>Descrição *</label><textarea name="descricao" required rows="3"></textarea></div>
        
        <div class="modal-actions">
          <button type="button" class="btn-modal secondary" onclick="fecharModal('modal-novo')">Cancelar</button>
          <button type="submit" class="btn-modal primary">Criar Chamado</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    let idAdmin = null, chamados = [], clientes = [];

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }
      idAdmin = session.user.id;
      await carregarDados();
      mudarAba('chamados');
    }

    async function carregarDados() {
      const { data: c } = await db.from("chamados").select("*").order("criado_em", { ascending: false });
      chamados = c || [];
      const { data: cl } = await db.from("usuarios").select("*").eq("is_admin", false);
      clientes = cl || [];
      renderizarTabelaChamados();
      renderizarTabelaClientes();
    }

    function mudarAba(aba) {
      document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
      document.getElementById('nav-' + aba).classList.add('active');
      document.querySelectorAll('.tela').forEach(t => t.classList.remove('active'));
      document.getElementById('tela-' + aba).classList.add('active');
      
      if (aba === 'chamados') {
        document.getElementById('page-title').textContent = 'Chamados';
        document.getElementById('page-desc').textContent = 'Gerencie todos os chamados.';
        document.getElementById('btn-novo-chamado').style.display = 'block';
      } else if (aba === 'clientes') {
        document.getElementById('page-title').textContent = 'Clientes';
        document.getElementById('page-desc').textContent = 'Base de clientes.';
        document.getElementById('btn-novo-chamado').style.display = 'none';
      }
    }

    function renderizarTabelaChamados() {
      let html = '';
      chamados.forEach(c => {
        html += `<tr>
          <td>${c.protocolo || 'Gerando...'}</td>
          <td>${c.cliente_nome || 'Visitante'}</td>
          <td>${c.titulo}</td>
          <td><span class="pill">${c.status}</span></td>
          <td><button class="btn-acao" onclick="abrirModalChamado('${c.id}')">Gerenciar</button></td>
        </tr>`;
      });
      document.getElementById('tabela-chamados-body').innerHTML = html;
    }

    function renderizarTabelaClientes() {
      let html = '';
      clientes.forEach(c => {
        html += `<tr><td>${c.nome}</td><td>${c.email}</td><td>${c.telefone || '—'}</td><td>${new Date(c.criado_em || Date.now()).toLocaleDateString('pt-BR')}</td></tr>`;
      });
      document.getElementById('tabela-clientes-body').innerHTML = html;
    }

    // AÇÕES
    window.abrirNovoChamado = () => document.getElementById('modal-novo').style.display = 'flex';
    window.fecharModal = (id) => document.getElementById(id).style.display = 'none';

    window.abrirModalChamado = (id) => {
      const c = chamados.find(x => x.id === id);
      document.getElementById('edit-id').value = c.id;
      document.getElementById('edit-cliente').value = c.cliente_nome;
      document.getElementById('edit-status').value = c.status;
      document.getElementById('modal-chamado').style.display = 'flex';
    };

    window.salvarChamado = async () => {
      const id = document.getElementById('edit-id').value;
      const status = document.getElementById('edit-status').value;
      await db.from("chamados").update({ status }).eq("id", id);
      fecharModal('modal-chamado');
      await carregarDados();
    };

    window.excluirChamado = async () => {
      const id = document.getElementById('edit-id').value;
      if (!confirm("Excluir?")) return;
      await db.from("chamados").delete().eq("id", id);
      fecharModal('modal-chamado');
      await carregarDados();
    };

    // NOVO CHAMADO (CRIA CLIENTE E CHAMADO)
    document.getElementById('form-novo').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = "Criando...";
      
      const formData = new FormData(e.target);
      const nome = formData.get('nome');
      const email = formData.get('email');
      const telefone = formData.get('telefone');
      const categoria = formData.get('categoria');
      const titulo = formData.get('titulo');
      const descricao = formData.get('descricao');

      try {
        // 1. Cria o Chamado
        const { data: chamado, error } = await db.from('chamados').insert({
          cliente_nome: nome,
          cliente_email: email,
          cliente_telefone: telefone,
          categoria: categoria,
          titulo: titulo,
          descricao: descricao,
          status: "Nova chamada"
        }).select().single();

        if (error) throw error;

        // 2. Tenta salvar o cliente na tabela de usuários (se não existir)
        if (email) {
          const { data: existe } = await db.from('usuarios').select('id').eq('email', email).maybeSingle();
          if (!existe) {
            await db.from('usuarios').insert({ nome, email, telefone, is_admin: false });
          }
        }

        alert(`Chamado criado! Protocolo: ${chamado.protocolo}`);
        fecharModal('modal-novo');
        e.target.reset();
        await carregarDados();

      } catch (err) {
        alert("Erro: " + err.message);
      } finally {
        btn.disabled = false; btn.textContent = "Criar Chamado";
      }
    };

    init();
  </script>
</body>
</html>
