<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Administrativo — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* TEMA CLARO */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #F8F9FA; --s1: #FFFFFF; --s2: #F3F4F6; --border: #E5E7EB; --text-main: #1F2937; --text-muted: #6B7280; --brand: #8fd21f; --brand-dark: #7ab81a; --err: #EF4444; }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }

  /* SIDEBAR */
  .sidebar { width: 240px; background: var(--s1); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk'; font-size: 18px; font-weight: 700; margin-bottom: 40px; }
  .logo i { background: var(--brand); color: #fff; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-style: normal; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
  .sidebar a { padding: 10px 14px; border-radius: 8px; font-weight: 500; color: var(--text-muted); font-size: 14px; cursor: pointer; }
  .sidebar a:hover, .sidebar a.active { background: rgba(143, 210, 31, 0.1); color: var(--brand-dark); }
  .sidebar .sair { margin-top: auto; color: var(--err); }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; border-bottom: 1px solid var(--border); background: var(--s1); }
  .content { padding: 32px; overflow-y: auto; flex: 1; }
  
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .page-header h1 { font-family: 'Space Grotesk'; font-size: 28px; }
  .btn-new { background: var(--brand); color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 600; }

  .tela { display: none; }
  .tela.active { display: block; }

  /* TABELAS */
  .table-box { background: var(--s1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 16px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .pill { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12px; background: rgba(143, 210, 31, 0.15); color: var(--brand-dark); }
  .btn-acao { background: var(--brand); color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 12px; }

  /* MODAIS */
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-box { background: var(--s1); border-radius: 16px; width: 95%; max-width: 500px; padding: 32px; display: flex; flex-direction: column; gap: 16px; }
  .modal-box h2 { font-family: 'Space Grotesk'; font-size: 20px; color: var(--brand-dark); }
  .form-group { margin-bottom: 8px; }
  .form-group label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; display: block; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  .modal-actions { display: flex; justify-content: space-between; margin-top: 16px; }
  .btn-modal { padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .btn-modal.primary { background: var(--brand); color: #fff; }
  .btn-modal.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
  
  /* KPIs */
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  .summary-card { background: var(--s1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .summary-card h3 { font-size: 24px; color: var(--brand-dark); }
</style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html" class="logo"><i>TE</i><span>Tech<b>Empire</b></span></a>
    <nav>
      <a id="nav-inicio" class="active" onclick="mudarAba('inicio')">Início</a>
      <a id="nav-chamados" onclick="mudarAba('chamados')">Chamados</a>
      <a id="nav-clientes" onclick="mudarAba('clientes')">Clientes</a>
      <a href="login.html" class="sair">Sair</a>
    </nav>
  </div>

  <div class="main">
    <div class="topbar">
      <div style="font-size: 13px; font-weight: 600;">Administrador</div>
    </div>

    <div class="content">
      
      <!-- TELA INÍCIO -->
      <div id="tela-inicio" class="tela active">
        <div class="page-header"><h1>Dashboard</h1></div>
        <div class="summary-grid">
          <div class="summary-card"><h3 id="kpi-total">0</h3><p>Total de Chamados</p></div>
          <div class="summary-card"><h3 id="kpi-pendentes">0</h3><p>Pendentes</p></div>
          <div class="summary-card"><h3 id="kpi-concluidos">0</h3><p>Concluídos</p></div>
          <div class="summary-card"><h3 id="kpi-clientes">0</h3><p>Clientes</p></div>
        </div>
      </div>

      <!-- TELA CHAMADOS -->
      <div id="tela-chamados" class="tela">
        <div class="page-header">
          <h1>Chamados</h1>
          <button class="btn-new" onclick="abrirModal('modal-novo')">+ Novo Chamado</button>
        </div>
        <div class="table-box">
          <table>
            <thead><tr><th>Protocolo</th><th>Cliente</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody id="tabela-chamados-body"></tbody>
          </table>
        </div>
      </div>

      <!-- TELA CLIENTES -->
      <div id="tela-clientes" class="tela">
        <div class="page-header"><h1>Clientes</h1></div>
        <div class="table-box">
          <table>
            <thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th></tr></thead>
            <tbody id="tabela-clientes-body"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- MODAL: NOVO CHAMADO -->
  <div class="modal" id="modal-novo">
    <div class="modal-box">
      <h2>Novo Chamado</h2>
      <form id="form-novo">
        <div class="form-group"><label>Nome do Cliente *</label><input name="nome" required></div>
        <div class="form-group"><label>Telefone *</label><input name="telefone" required></div>
        <div class="form-group"><label>E-mail</label><input name="email" type="email"></div>
        <div class="form-group">
          <label>Tipo de Serviço</label>
          <select name="categoria">
            <option value="Manutenção">Manutenção de Computador</option>
            <option value="Site">Criação de Site</option>
          </select>
        </div>
        <div class="form-group"><label>Assunto *</label><input name="titulo" required></div>
        <div class="form-group"><label>Descrição *</label><textarea name="descricao" required rows="3"></textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn-modal secondary" onclick="fecharModal('modal-novo')">Cancelar</button>
          <button type="submit" class="btn-modal primary">Criar Chamado</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: GERENCIAR CHAMADO -->
  <div class="modal" id="modal-chamado">
    <div class="modal-box">
      <h2>Gerenciar Chamado</h2>
      <input type="hidden" id="edit-id">
      <div class="form-group"><label>Cliente</label><input type="text" id="edit-cliente" disabled></div>
      <div class="form-group">
        <label>Status</label>
        <select id="edit-status">
          <option value="Nova chamada">Nova chamada</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Aguardando aprovação do orçamento">Aguardando cliente</option>
          <option value="Concluída">Concluída</option>
        </select>
      </div>
      <div class="form-group">
        <label>Parecer Técnico / Orçamento</label>
        <textarea id="edit-parecer" rows="3"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-modal secondary" onclick="fecharModal('modal-chamado')">Cancelar</button>
        <button class="btn-modal primary" onclick="salvarChamado()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    let idAdmin = null;

    // NAVEGAÇÃO
    function mudarAba(aba) {
      document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
      document.querySelectorAll('.tela').forEach(t => t.classList.remove('active'));
      document.getElementById('nav-' + aba).classList.add('active');
      document.getElementById('tela-' + aba).classList.add('active');
    }

    window.abrirModal = (id) => document.getElementById(id).style.display = 'flex';
    window.fecharModal = (id) => document.getElementById(id).style.display = 'none';

    // CARREGAR DADOS
    async function carregarDados() {
      // Chamados
      const { data: chamados } = await db.from('chamados').select('*').order('criado_em', { ascending: false });
      const tbody = document.getElementById('tabela-chamados-body');
      
      if (chamados) {
        tbody.innerHTML = chamados.map(c => `
          <tr>
            <td>${c.protocolo}</td>
            <td>${c.cliente_nome}</td>
            <td><span class="pill">${c.status}</span></td>
            <td><button class="btn-acao" onclick="abrirChamado('${c.id}')">Gerenciar</button></td>
          </tr>
        `).join('');

        // KPIs
        document.getElementById('kpi-total').textContent = chamados.length;
        document.getElementById('kpi-pendentes').textContent = chamados.filter(c => c.status === 'Nova chamada').length;
        document.getElementById('kpi-concluidos').textContent = chamados.filter(c => c.status === 'Concluída').length;
      }

      // Clientes
      const { data: clientes } = await db.from('usuarios').select('*').eq('is_admin', false);
      const tbodyCli = document.getElementById('tabela-clientes-body');
      if (clientes) {
        tbodyCli.innerHTML = clientes.map(c => `<tr><td>${c.nome}</td><td>${c.email}</td><td>${c.telefone || '—'}</td></tr>`).join('');
        document.getElementById('kpi-clientes').textContent = clientes.length;
      }
    }

    // ABRIR CHAMADO
    window.abrirChamado = async (id) => {
      const { data: c } = await db.from('chamados').select('*').eq('id', id).single();
      document.getElementById('edit-id').value = c.id;
      document.getElementById('edit-cliente').value = c.cliente_nome;
      document.getElementById('edit-status').value = c.status;
      document.getElementById('edit-parecer').value = c.parecer_tecnico || '';
      abrirModal('modal-chamado');
    };

    // SALVAR CHAMADO
    window.salvarChamado = async () => {
      const id = document.getElementById('edit-id').value;
      await db.from('chamados').update({
        status: document.getElementById('edit-status').value,
        parecer_tecnico: document.getElementById('edit-parecer').value
      }).eq('id', id);
      fecharModal('modal-chamado');
      carregarDados();
    };

    // NOVO CHAMADO
    document.getElementById('form-novo').onsubmit = async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const { data: ch, error } = await db.from('chamados').insert({
        cliente_nome: form.get('nome'),
        cliente_telefone: form.get('telefone'),
        cliente_email: form.get('email'),
        categoria: form.get('categoria'),
        titulo: form.get('titulo'),
        descricao: form.get('descricao'),
        status: "Nova chamada"
      }).select().single();
      
      if (error) return alert("Erro: " + error.message);
      
      if (form.get('email')) {
        const { data: user } = await db.from('usuarios').select('id').eq('email', form.get('email')).maybeSingle();
        if (!user) await db.from('usuarios').insert({ nome: form.get('nome'), email: form.get('email'), telefone: form.get('telefone') });
      }

      alert(`Chamado criado! Protocolo: ${ch.protocolo}`);
      fecharModal('modal-novo');
      e.target.reset();
      carregarDados();
    };

    // INICIALIZA
    carregarDados();
  </script>
</body>
</html>
