<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área do Cliente — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= ESTÉTICA PREMIUM E TECNOLÓGICA ================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07090b;
    --s1: rgba(18, 21, 24, 0.7); /* Efeito translúcido */
    --s2: rgba(26, 29, 33, 0.8);
    --line: rgba(255, 255, 255, 0.08);
    --line2: rgba(255, 255, 255, 0.15);
    --ink: #FFFFFF;
    --muted: #9ba1a6;
    --turquesa: #00DDB5;
    --err: #ff7b6b;
  }
  
  body { 
    background: var(--bg); 
    font-family: 'Inter', sans-serif; 
    color: var(--ink); 
    display: flex; 
    height: 100vh; 
    overflow: hidden;
    /* Fundo tecnológico com grid e brilho */
    background-image: 
      radial-gradient(ellipse at 50% -20%, rgba(0, 221, 181, 0.15), transparent 50%),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
  }
  
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; font-family: inherit; border: none; }

  /* Animações */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-in { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
  
  /* ================= SIDEBAR (VIDRO) ================= */
  .sidebar { width: 270px; background: var(--s1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-right: 1px solid var(--line); padding: 30px 24px; display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 12px; font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 800; margin-bottom: 50px; letter-spacing: -0.5px; }
  .logo i { background: var(--turquesa); color: #000; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-style: normal; box-shadow: 0 0 20px rgba(0, 221, 181, 0.4); }
  .logo b { color: var(--turquesa); }
  
  .sidebar nav { display: flex; flex-direction: column; gap: 8px; }
  .sidebar a { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 12px; font-weight: 500; color: var(--muted); transition: all 0.3s ease; cursor: pointer; font-size: 15px; border: 1px solid transparent; }
  .sidebar a:hover { color: var(--ink); background: rgba(255,255,255,0.03); }
  .sidebar a.active { background: rgba(0, 221, 181, 0.1); color: var(--turquesa); border-color: rgba(0, 221, 181, 0.2); box-shadow: inset 0 0 20px rgba(0,221,181,0.05); }
  .sidebar .sair { margin-top: auto; color: var(--err); border-top: 1px solid var(--line); border-radius: 0; padding-top: 24px; }
  .sidebar .sair:hover { background: transparent; color: #ff9c90; }

  /* ================= MAIN ================= */
  .main { flex: 1; padding: 50px; overflow-y: auto; position: relative; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .header h1 { font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -1px; }
  .header p { color: var(--muted); margin-top: 8px; font-size: 16px; }
  
  .tela { display: none; }
  .tela.active { display: block; animation: fadeUp 0.4s ease forwards; }

  /* ================= KPIS ================= */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .kpi { background: var(--s2); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 20px; padding: 28px; position: relative; overflow: hidden; transition: transform 0.3s; }
  .kpi:hover { transform: translateY(-4px); border-color: var(--line2); }
  .kpi::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--turquesa), transparent); opacity: 0.8; }
  .kpi h3 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; font-weight: 600; }
  .kpi b { font-family: 'Montserrat', sans-serif; font-size: 42px; color: var(--ink); line-height: 1; }

  /* ================= TABELAS ================= */
  .box { background: var(--s2); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 24px; padding: 32px; width: 100%; overflow: hidden; }
  .box h3 { font-family: 'Montserrat', sans-serif; font-size: 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
  
  .filters { display: flex; gap: 16px; margin-bottom: 24px; }
  .filters input, .filters select { padding: 14px 20px; border-radius: 12px; border: 1px solid var(--line2); background: rgba(0,0,0,0.3); color: var(--ink); outline: none; font-size: 14px; transition: 0.3s; }
  .filters input:focus, .filters select:focus { border-color: var(--turquesa); box-shadow: 0 0 0 3px rgba(0, 221, 181, 0.1); }
  .filters input { flex: 1; max-width: 350px; }
  
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { text-align: left; padding: 16px; color: var(--muted); border-bottom: 1px solid var(--line2); font-size: 12px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
  td { padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 15px; vertical-align: middle; }
  tr { transition: background 0.2s; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  
  .pill { background: rgba(0, 221, 181, 0.1); color: var(--turquesa); padding: 6px 14px; border-radius: 99px; font-weight: 600; font-size: 13px; border: 1px solid rgba(0, 221, 181, 0.2); display: inline-block; }
  
  .btn-acao { background: var(--turquesa); color: #000; padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; transition: 0.3s; display: inline-block; box-shadow: 0 4px 15px rgba(0, 221, 181, 0.2); }
  .btn-acao:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 221, 181, 0.4); background: #00F5C8; }

  /* ================= FORMULÁRIO DE PERFIL ================= */
  .form-group { margin-bottom: 24px; max-width: 500px; }
  .form-group label { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .form-group input { width: 100%; padding: 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--line2); border-radius: 12px; color: var(--ink); outline: none; font-size: 16px; transition: 0.3s; }
  .form-group input:focus { border-color: var(--turquesa); box-shadow: 0 0 0 3px rgba(0, 221, 181, 0.1); }
  .form-group input:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-salvar { background: var(--turquesa); color: #000; border: none; padding: 16px 36px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 221, 181, 0.2); }
  .btn-salvar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 221, 181, 0.4); }

  .msg { padding: 16px; border-radius: 12px; margin-bottom: 24px; display: none; font-weight: 500; font-size: 15px; }
  .msg.on { display: block; animation: fadeUp 0.3s ease; } 
  .msg.ok { background: rgba(0, 221, 181, 0.1); color: var(--turquesa); border: 1px solid rgba(0, 221, 181, 0.3); } 
  .msg.err { background: rgba(255, 123, 107, 0.1); color: var(--err); border: 1px solid rgba(255, 123, 107, 0.3); }
</style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar animate-in" style="animation-delay: 0.1s;">
    <a href="index.html" class="logo"><i>TE</i><span>Tech<b>Empire</b></span></a>
    <nav>
      <a class="active" onclick="mudarTela('dashboard', this)">📊 Meus Chamados</a>
      <a onclick="mudarTela('perfil', this)">👤 Meu Perfil</a>
      <a href="index.html" style="color:var(--muted); margin-top:30px; border: 1px solid var(--line);">← Voltar ao site</a>
      <a class="sair" onclick="sair()">Sair da conta</a>
    </nav>
  </div>

  <!-- MAIN -->
  <div class="main">
    
    <!-- TELA DASHBOARD -->
    <div id="tela-dashboard" class="tela active">
      <div class="header animate-in" style="animation-delay: 0.2s;">
        <div>
          <h1 id="saudacao">Olá, Cliente.</h1>
          <p>Acompanhe seus atendimentos e solicite novos serviços.</p>
        </div>
        <a href="novo-chamado.html" class="btn-acao" style="padding: 16px 32px; font-size: 15px; border-radius: 12px;">+ Novo Atendimento</a>
      </div>

      <div class="kpis animate-in" style="animation-delay: 0.3s;">
        <div class="kpi"><h3>Chamados Abertos</h3><b id="kpi-abertos">0</b></div>
        <div class="kpi"><h3>Em Andamento</h3><b id="kpi-andamento">0</b></div>
        <div class="kpi"><h3>Concluídos</h3><b id="kpi-concluidos">0</b></div>
      </div>

      <div class="box animate-in" style="animation-delay: 0.4s;">
        <h3>Meus Atendimentos</h3>
        
        <div class="filters">
          <input type="text" id="busca" placeholder="Buscar por título ou número...">
          <select id="filtro-status">
            <option value="">Todos os status</option>
            <option value="Nova chamada">Nova chamada</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Concluída">Concluída</option>
            <option value="Cancelada">Cancelada</option>
          </select>
        </div>

        <div id="tabela-chamados">
          <p style="color: var(--muted); padding: 20px 0;">Carregando chamados...</p>
        </div>
      </div>
    </div>

    <!-- TELA PERFIL -->
    <div id="tela-perfil" class="tela">
      <div class="header animate-in">
        <h1>Meu Perfil</h1>
      </div>
      
      <div class="box animate-in" style="animation-delay: 0.1s;">
        <h3>Dados Cadastrais</h3>
        <div class="msg" id="msg-perfil"></div>
        
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" id="p-nome">
        </div>
        
        <div class="form-group">
          <label>E-mail (Não editável)</label>
          <input type="email" id="p-email" disabled>
        </div>

        <div class="form-group">
          <label>CPF (Não editável)</label>
          <input type="text" id="p-cpf" disabled>
        </div>
        
        <div class="form-group">
          <label>Telefone / WhatsApp</label>
          <input type="text" id="p-telefone" placeholder="(00) 00000-0000">
        </div>
        
        <button class="btn-salvar" onclick="salvarPerfil()">Salvar Alterações</button>
      </div>
    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  
  <script>
    const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    let userId = null;
    let chamadosGlobais = [];

    async function init() {
      userId = sessionStorage.getItem('te_user_id');
      if (!userId) {
        const { data: { session } } = await db.auth.getSession();
        if (session) { userId = session.user.id; sessionStorage.setItem('te_user_id', userId); }
      }
      
      if (!userId) { window.location.href = "login.html"; return; }

      const { data: perfil } = await db.from("usuarios").select("*").eq("id", userId).maybeSingle();
      
      if (perfil) {
        document.getElementById('saudacao').textContent = `Olá, ${perfil.nome.split(' ')[0]}.`;
        document.getElementById('p-nome').value = perfil.nome || "";
        document.getElementById('p-email').value = perfil.email || sessionStorage.getItem('te_user_email') || "";
        document.getElementById('p-cpf').value = perfil.cpf || "";
        document.getElementById('p-telefone').value = perfil.telefone || "";
      }

      carregarChamados();

      document.getElementById('busca').addEventListener('input', renderizarTabelaChamados);
      document.getElementById('filtro-status').addEventListener('change', renderizarTabelaChamados);
    }

    function mudarTela(id, el) {
      document.querySelectorAll('.tela').forEach(t => t.classList.remove('active'));
      document.getElementById(`tela-${id}`).classList.add('active');
      document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
      el.classList.add('active');
    }

    async function carregarChamados() {
      const { data, error } = await db.from("chamados").select("*").eq("cliente_id", userId).order("criado_em", { ascending: false });
      
      if (error) {
        document.getElementById('tabela-chamados').innerHTML = `<p style="color: var(--err);">Erro ao carregar chamados.</p>`;
        return;
      }

      chamadosGlobais = data || [];

      const abertos = chamadosGlobais.filter(c => !['Concluída', 'Cancelada'].includes(c.status)).length;
      const andamento = chamadosGlobais.filter(c => c.status === 'Em andamento').length;
      const concluidos = chamadosGlobais.filter(c => c.status === 'Concluída').length;

      document.getElementById('kpi-abertos').textContent = abertos;
      document.getElementById('kpi-andamento').textContent = andamento;
      document.getElementById('kpi-concluidos').textContent = concluidos;

      renderizarTabelaChamados();
    }

    function renderizarTabelaChamados() {
      const busca = document.getElementById('busca').value.toLowerCase();
      const statusFiltro = document.getElementById('filtro-status').value;

      let filtrados = chamadosGlobais.filter(c => {
        const matchBusca = c.titulo.toLowerCase().includes(busca) || String(c.numero).includes(busca);
        const matchStatus = statusFiltro === "" || c.status === statusFiltro;
        return matchBusca && matchStatus;
      });

      if (filtrados.length === 0) {
        document.getElementById('tabela-chamados').innerHTML = "<p style='color:var(--muted); padding: 20px 0;'>Nenhum chamado encontrado com esses filtros.</p>";
        return;
      }

      let html = `<table><thead><tr><th>Nº</th><th>Serviço</th><th>Data</th><th>Status</th><th>Ação</th></tr></thead><tbody>`;
      filtrados.forEach(c => {
        html += `<tr>
          <td><b>TE-${String(c.numero).padStart(6, '0')}</b></td>
          <td>${c.titulo}</td>
          <td>${new Date(c.criado_em).toLocaleDateString('pt-BR')}</td>
          <td><span class="pill">${c.status}</span></td>
          <td><a href="chamado.html?id=${c.id}" class="btn-acao">Abrir</a></td>
        </tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById('tabela-chamados').innerHTML = html;
    }

    async function salvarPerfil() {
      const nome = document.getElementById('p-nome').value;
      const telefone = document.getElementById('p-telefone').value;
      const msg = document.getElementById('msg-perfil');

      const { error } = await db.from("usuarios").update({ nome, telefone }).eq("id", userId);
      
      if (error) {
        msg.textContent = "Erro ao salvar: " + error.message;
        msg.className = "msg on err";
      } else {
        msg.textContent = "Perfil atualizado com sucesso!";
        msg.className = "msg on ok";
        document.getElementById('saudacao').textContent = `Olá, ${nome.split(' ')[0]}.`;
        setTimeout(() => msg.className = "msg", 3000);
      }
    }

    async function sair() {
      sessionStorage.removeItem('te_user_id');
      sessionStorage.removeItem('te_user_email');
      await db.auth.signOut();
      window.location.href = "login.html";
    }

    init();
  </script>
</body>
</html>
