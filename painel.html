<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área do Cliente — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #06080a; font-family: 'Inter', sans-serif; color: #fff; display: flex; min-height: 100vh; overflow: hidden; }
  
  .sidebar { width: 260px; background: #0a0d0f; border-right: 1px solid #222; padding: 24px; display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 40px; }
  .logo i { background: #b4f03c; color: #000; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-style: normal; }
  .logo b { color: #b4f03c; }
  .sidebar a { display: flex; align-items: center; gap: 10px; padding: 12px 16px; text-decoration: none; border-radius: 8px; font-weight: 500; margin-bottom: 6px; color: #d1d5db; cursor: pointer; transition: 0.2s; }
  .sidebar a:hover, .sidebar a.active { background: rgba(180,240,60,0.1); color: #b4f03c; }
  .sidebar .sair { margin-top: auto; color: #ff7b6b; border-top: 1px solid #222; padding-top: 20px; }

  .main { flex: 1; padding: 40px; overflow-y: auto; position: relative; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; }
  
  /* Notificações */
  .notification-bell { position: relative; cursor: pointer; font-size: 24px; }
  .notification-badge { position: absolute; top: -5px; right: -5px; background: #ff7b6b; color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 99px; display: none; }
  .notification-dropdown { position: absolute; top: 40px; right: 0; width: 300px; background: #12161a; border: 1px solid #333; border-radius: 12px; padding: 15px; display: none; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .notification-dropdown.active { display: block; }
  .notification-item { padding: 10px 0; border-bottom: 1px solid #222; font-size: 13px; color: #d1d5db; }
  .notification-item:last-child { border-bottom: none; }

  .tela { display: none; }
  .tela.active { display: block; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .kpi { background: #12161a; border: 1px solid #333; border-radius: 12px; padding: 20px; position: relative; overflow: hidden; }
  .kpi::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #b4f03c; }
  .kpi h3 { font-size: 12px; color: #97a0a6; text-transform: uppercase; margin-bottom: 10px; }
  .kpi b { font-family: 'Space Grotesk', sans-serif; font-size: 36px; color: #fff; }

  .box { background: #12161a; border: 1px solid #333; border-radius: 12px; padding: 24px; width: 100%; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { text-align: left; padding: 12px; color: #b4f03c; border-bottom: 1px solid #333; font-size: 12px; text-transform: uppercase; white-space: nowrap; }
  td { padding: 16px 12px; border-bottom: 1px solid #222; font-size: 14px; word-wrap: break-word; }
  .pill { background: rgba(180,240,60,0.15); color: #b4f03c; padding: 4px 12px; border-radius: 99px; font-weight: bold; font-size: 12px; border: 1px solid rgba(180,240,60,0.3); display: inline-block; }
  .btn-acao { background: #b4f03c; color: #000; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 13px; border: none; cursor: pointer; display: inline-block; text-align: center; }

  .form-group { margin-bottom: 20px; max-width: 500px; }
  .form-group label { display: block; font-size: 13px; color: #b4f03c; font-weight: bold; margin-bottom: 8px; }
  .form-group input { width: 100%; padding: 14px; background: #06080a; border: 1px solid #444; border-radius: 8px; color: #fff; outline: none; }
  .form-group input:disabled { opacity: 0.5; }
  .btn-salvar { background: #b4f03c; color: #000; border: none; padding: 14px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }

  .msg { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; font-weight: bold; }
  .msg.on { display: block; } .msg.ok { background: rgba(180,240,60,0.15); color: #b4f03c; } .msg.err { background: rgba(255,123,107,0.15); color: #ff7b6b; }
</style>
</head>
<body>

  <div class="sidebar">
    <a href="index.html" class="logo"><i>TE</i><span>Tech<b>Empire</b></span></a>
    <a class="active" onclick="mudarTela('dashboard', this)">📊 Meus Chamados</a>
    <a onclick="mudarTela('perfil', this)">👤 Meu Perfil</a>
    <a href="index.html" style="color:#97a0a6; margin-top:20px;">← Voltar ao site</a>
    <a class="sair" onclick="sair()">Sair da conta</a>
  </div>

  <div class="main">
    <div class="header" style="justify-content: space-between;">
      <div>
        <h1 id="saudacao">Olá, Cliente.</h1>
        <p style="color: #97a0a6; margin-top: 5px;">Acompanhe seus atendimentos.</p>
      </div>
      
      <!-- SINO DE NOTIFICAÇÃO -->
      <div class="notification-bell" onclick="toggleNotificacoes()">
        🔔
        <span class="notification-badge" id="notif-badge">0</span>
        <div class="notification-dropdown" id="notif-dropdown">
          <h4 style="margin-bottom: 10px; color: #b4f03c;">Notificações</h4>
          <div id="notif-lista"><p style="font-size: 12px; color: #97a0a6;">Nenhuma notificação nova.</p></div>
        </div>
      </div>
    </div>

    <div id="tela-dashboard" class="tela active">
      <div style="margin-bottom: 20px;">
        <a href="novo-chamado.html" class="btn-acao" style="padding: 12px 24px; font-size: 15px;">+ Novo Atendimento</a>
      </div>

      <div class="kpis">
        <div class="kpi"><h3>Chamados Abertos</h3><b id="kpi-abertos">0</b></div>
        <div class="kpi"><h3>Em Andamento</h3><b id="kpi-andamento">0</b></div>
        <div class="kpi"><h3>Concluídos</h3><b id="kpi-concluidos">0</b></div>
      </div>

      <div class="box">
        <h3 style="margin-bottom: 20px; font-family: 'Space Grotesk';">Meus Atendimentos</h3>
        <div id="tabela-chamados"><p style="color: #97a0a6;">Carregando chamados...</p></div>
      </div>
    </div>

    <div id="tela-perfil" class="tela">
      <div class="box">
        <div class="msg" id="msg-perfil"></div>
        <div class="form-group"><label>Nome Completo</label><input type="text" id="p-nome"></div>
        <div class="form-group"><label>E-mail (Não editável)</label><input type="email" id="p-email" disabled></div>
        <div class="form-group"><label>CPF (Não editável)</label><input type="text" id="p-cpf" disabled></div>
        <div class="form-group"><label>Telefone / WhatsApp</label><input type="text" id="p-telefone"></div>
        <button class="btn-salvar" onclick="salvarPerfil()">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  
  <script>
    const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    let userId = null;

    async function init() {
      userId = sessionStorage.getItem('te_user_id');
      if (!userId) {
        const { data: { session } } = await db.auth.getSession();
        if (session) { userId = session.user.id; sessionStorage.setItem('te_user_id', userId); }
      }
      if (!userId) { window.location.href = "login.html"; return; }

      // Busca perfil
      const { data: perfil } = await db.from("usuarios").select("*").eq("id", userId).maybeSingle();
      if (perfil) {
        document.getElementById('saudacao').textContent = `Olá, ${perfil.nome.split(' ')[0]}.`;
        document.getElementById('p-nome').value = perfil.nome || "";
        document.getElementById('p-email').value = perfil.email || sessionStorage.getItem('te_user_email') || "";
        document.getElementById('p-cpf').value = perfil.cpf || "";
        document.getElementById('p-telefone').value = perfil.telefone || "";
      }

      carregarChamados();
      carregarNotificacoes();

      // Escuta em tempo real novas notificações
      db.channel('notificacoes-live')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notificacoes', filter: `usuario_id=eq.${userId}` }, () => {
          carregarNotificacoes();
        }).subscribe();
    }

    function toggleNotificacoes() {
      document.getElementById('notif-dropdown').classList.toggle('active');
    }

    async function carregarNotificacoes() {
      const { data } = await db.from("notificacoes").select("*").eq("usuario_id", userId).eq("lida", false).order("criado_em", { ascending: false });
      
      const badge = document.getElementById('notif-badge');
      const lista = document.getElementById('notif-lista');

      if (data && data.length > 0) {
        badge.style.display = 'block';
        badge.textContent = data.length;
        lista.innerHTML = data.map(n => `<div class="notification-item">${n.mensagem}</div>`).join('');
      } else {
        badge.style.display = 'none';
        lista.innerHTML = '<p style="font-size: 12px; color: #97a0a6;">Nenhuma notificação nova.</p>';
      }
    }

    function mudarTela(id, el) {
      document.querySelectorAll('.tela').forEach(t => t.classList.remove('active'));
      document.getElementById(`tela-${id}`).classList.add('active');
      document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
      el.classList.add('active');
    }

    async function carregarChamados() {
      const { data: chamados } = await db.from("chamados").select("*").eq("cliente_id", userId).order("criado_em", { ascending: false });
      const abertos = chamados ? chamados.filter(c => !['Concluída', 'Cancelada'].includes(c.status)).length : 0;
      const andamento = chamados ? chamados.filter(c => c.status === 'Em andamento').length : 0;
      const concluidos = chamados ? chamados.filter(c => c.status === 'Concluída').length : 0;

      document.getElementById('kpi-abertos').textContent = abertos;
      document.getElementById('kpi-andamento').textContent = andamento;
      document.getElementById('kpi-concluidos').textContent = concluidos;

      if (!chamados || chamados.length === 0) {
        document.getElementById('tabela-chamados').innerHTML = "<p style='color:#97a0a6;'>Você ainda não tem chamados.</p>";
        return;
      }

      let html = `<table><thead><tr><th>Nº</th><th>Serviço</th><th>Status</th><th>Ação</th></tr></thead><tbody>`;
      chamados.forEach(c => {
        html += `<tr>
          <td><b>TE-${String(c.numero).padStart(6, '0')}</b></td>
          <td>${c.titulo}</td>
          <td><span class="pill">${c.status}</span></td>
          <td><a href="chamado.html?id=${c.id}" class="btn-acao">Abrir</a></td>
        </tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById('tabela-chamados').innerHTML = html;
    }

    async function salvarPerfil() {
      const nome = document.getElementById('p-nome').value;
      const telefone = document.getElementById('p-telefone').value;
      const msg = document.getElementById('msg-perfil');

      const { error } = await db.from("usuarios").update({ nome, telefone }).eq("id", userId);
      
      if (error) {
        msg.textContent = "Erro ao salvar: " + error.message;
        msg.className = "msg on err";
      } else {
        msg.textContent = "Perfil atualizado com sucesso!";
        msg.className = "msg on ok";
        document.getElementById('saudacao').textContent = `Olá, ${nome.split(' ')[0]}.`;
      }
    }

    async function sair() {
      sessionStorage.removeItem('te_user_id');
      sessionStorage.removeItem('te_user_email');
      await db.auth.signOut();
      window.location.href = "login.html";
    }

    init();
  </script>
</body>
</html>
