<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área do Cliente — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ================= IDENTIDADE VISUAL PREMIUM ================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0D0F;      /* Preto Tecnológico */
    --s1: #121518;      /* Fundo Sidebar */
    --s2: #1A1D21;      /* Fundo Cards */
    --line: #2a2d31;
    --line2: #3a3f44;
    --ink: #FFFFFF;
    --muted: #BFC3C7;
    --turquesa: #00DDB5;
    --err: #ff7b6b;
  }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--ink); display: flex; height: 100vh; overflow: hidden; }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; font-family: inherit; border: none; }
  
  /* ================= SIDEBAR ================= */
  .sidebar { width: 260px; background: var(--s1); border-right: 1px solid var(--line); padding: 24px; display: flex; flex-direction: column; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 800; margin-bottom: 40px; }
  .logo i { background: var(--turquesa); color: #000; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-style: normal; }
  .logo b { color: var(--turquesa); }
  .sidebar nav { display: flex; flex-direction: column; gap: 6px; }
  .sidebar a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; font-weight: 500; color: var(--muted); transition: 0.2s; cursor: pointer; }
  .sidebar a:hover, .sidebar a.active { background: rgba(0, 221, 181, 0.1); color: var(--turquesa); }
  .sidebar .sair { margin-top: auto; color: var(--err); border-top: 1px solid var(--line); padding-top: 20px; }

  /* ================= MAIN ================= */
  .main { flex: 1; padding: 40px; overflow-y: auto; position: relative; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .header h1 { font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 800; }
  .header p { color: var(--muted); margin-top: 5px; font-size: 15px; }
  
  .tela { display: none; }
  .tela.active { display: block; }

  /* ================= KPIS ================= */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .kpi { background: var(--s2); border: 1px solid var(--line); border-radius: 16px; padding: 24px; position: relative; overflow: hidden; }
  .kpi::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--turquesa); opacity: 0.8; }
  .kpi h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; font-weight: 600; }
  .kpi b { font-family: 'Montserrat', sans-serif; font-size: 36px; color: var(--ink); }

  /* ================= TABELAS ================= */
  .box { background: var(--s2); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: 100%; overflow: hidden; }
  .box h3 { font-family: 'Montserrat', sans-serif; font-size: 18px; margin-bottom: 20px; }
  
  .filters { display: flex; gap: 12px; margin-bottom: 20px; }
  .filters input, .filters select { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg); color: var(--ink); outline: none; font-size: 14px; }
  .filters input { flex: 1; max-width: 300px; }
  
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { text-align: left; padding: 16px 12px; color: var(--muted); border-bottom: 1px solid var(--line); font-size: 12px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; }
  td { padding: 16px 12px; border-bottom: 1px solid var(--line); font-size: 14px; word-wrap: break-word; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  
  .pill { background: rgba(0, 221, 181, 0.15); color: var(--turquesa); padding: 4px 12px; border-radius: 99px; font-weight: 600; font-size: 12px; border: 1px solid rgba(0, 221, 181, 0.3); display: inline-block; }
  .btn-acao { background: var(--turquesa); color: #000; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; border: none; cursor: pointer; display: inline-block; text-align: center; transition: 0.2s; }
  .btn-acao:hover { background: #00F5C8; }

  /* ================= FORMULÁRIO DE PERFIL ================= */
  .form-group { margin-bottom: 20px; max-width: 500px; }
  .form-group label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .form-group input { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; color: var(--ink); outline: none; font-size: 15px; }
  .form-group input:focus { border-color: var(--turquesa); }
  .form-group input:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-salvar { background: var(--turquesa); color: #000; border: none; padding: 14px 30px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; transition: 0.2s; }
  .btn-salvar:hover { background: #00F5C8; }

  .msg { padding: 14px; border-radius: 8px; margin-bottom: 20px; display: none; font-weight: 500; font-size: 14px; }
  .msg.on { display: block; } 
  .msg.ok { background: rgba(0, 221, 181, 0.1); color: var(--turquesa); border: 1px solid rgba(0, 221, 181, 0.3); } 
  .msg.err { background: rgba(255, 123, 107, 0.1); color: var(--err); border: 1px solid rgba(255, 123, 107, 0.3); }
</style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="index.html" class="logo"><i>TE</i><span>Tech<b>Empire</b></span></a>
    <nav>
      <a class="active" onclick="mudarTela('dashboard', this)">📊 Meus Chamados</a>
      <a onclick="mudarTela('perfil', this)">👤 Meu Perfil</a>
      <a href="index.html" style="color:var(--muted); margin-top:20px; font-size: 14px;">← Voltar ao site</a>
      <a class="sair" onclick="sair()">Sair da conta</a>
    </nav>
  </div>

  <!-- MAIN -->
  <div class="main">
    
    <!-- TELA DASHBOARD -->
    <div id="tela-dashboard" class="tela active">
      <div class="header">
        <div>
          <h1 id="saudacao">Olá, Cliente.</h1>
          <p>Acompanhe seus atendimentos e solicite novos serviços.</p>
        </div>
        <a href="novo-chamado.html" class="btn-acao" style="padding: 14px 28px; font-size: 15px;">+ Novo Atendimento</a>
      </div>

      <div class="kpis">
        <div class="kpi"><h3>Chamados Abertos</h3><b id="kpi-abertos">0</b></div>
        <div class="kpi"><h3>Em Andamento</h3><b id="kpi-andamento">0</b></div>
        <div class="kpi"><h3>Concluídos</h3><b id="kpi-concluidos">0</b></div>
      </div>

      <div class="box">
        <h3>Meus Atendimentos</h3>
        
        <div class="filters">
          <input type="text" id="busca" placeholder="Buscar por título ou número...">
          <select id="filtro-status">
            <option value="">Todos os status</option>
            <option value="Nova chamada">Nova chamada</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Concluída">Concluída</option>
            <option value="Cancelada">Cancelada</option>
          </select>
        </div>

        <div id="tabela-chamados">
          <p style="color: var(--muted); padding: 20px 0;">Carregando chamados...</p>
        </div>
      </div>
    </div>

    <!-- TELA PERFIL -->
    <div id="tela-perfil" class="tela">
      <div class="header">
        <h1>Meu Perfil</h1>
      </div>
      
      <div class="box">
        <h3>Dados Cadastrais</h3>
        <div class="msg" id="msg-perfil"></div>
        
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" id="p-nome">
        </div>
        
        <div class="form-group">
          <label>E-mail (Não editável)</label>
          <input type="email" id="p-email" disabled>
        </div>

        <div class="form-group">
          <label>CPF (Não editável)</label>
          <input type="text" id="p-cpf" disabled>
        </div>
        
        <div class="form-group">
          <label>Telefone / WhatsApp</label>
          <input type="text" id="p-telefone" placeholder="(00) 00000-0000">
        </div>
        
        <button class="btn-salvar" onclick="salvarPerfil()">Salvar Alterações</button>
      </div>
    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  
  <script>
    const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    let userId = null;
    let chamadosGlobais = [];

    async function init() {
      // Verifica o login usando a memória local e o Supabase
      userId = sessionStorage.getItem('te_user_id');
      if (!userId) {
        const { data: { session } } = await db.auth.getSession();
        if (session) { userId = session.user.id; sessionStorage.setItem('te_user_id', userId); }
      }
      
      if (!userId) { window.location.href = "login.html"; return; }

      // Puxa os dados do usuário
      const { data: perfil } = await db.from("usuarios").select("*").eq("id", userId).maybeSingle();
      
      if (perfil) {
        document.getElementById('saudacao').textContent = `Olá, ${perfil.nome.split(' ')[0]}.`;
        document.getElementById('p-nome').value = perfil.nome || "";
        document.getElementById('p-email').value = perfil.email || sessionStorage.getItem('te_user_email') || "";
        document.getElementById('p-cpf').value = perfil.cpf || "";
        document.getElementById('p-telefone').value = perfil.telefone || "";
      }

      carregarChamados();

      // Eventos de filtro
      document.getElementById('busca').addEventListener('input', renderizarTabelaChamados);
      document.getElementById('filtro-status').addEventListener('change', renderizarTabelaChamados);
    }

    // Navegação lateral
    function mudarTela(id, el) {
      document.querySelectorAll('.tela').forEach(t => t.classList.remove('active'));
      document.getElementById(`tela-${id}`).classList.add('active');
      document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
      el.classList.add('active');
    }

    // Busca os chamados do cliente
    async function carregarChamados() {
      const { data, error } = await db.from("chamados").select("*").eq("cliente_id", userId).order("criado_em", { ascending: false });
      
      if (error) {
        document.getElementById('tabela-chamados').innerHTML = `<p style="color: var(--err);">Erro ao carregar chamados.</p>`;
        return;
      }

      chamadosGlobais = data || [];

      // Atualiza os KPIs
      const abertos = chamadosGlobais.filter(c => !['Concluída', 'Cancelada'].includes(c.status)).length;
      const andamento = chamadosGlobais.filter(c => c.status === 'Em andamento').length;
      const concluidos = chamadosGlobais.filter(c => c.status === 'Concluída').length;

      document.getElementById('kpi-abertos').textContent = abertos;
      document.getElementById('kpi-andamento').textContent = andamento;
      document.getElementById('kpi-concluidos').textContent = concluidos;

      renderizarTabelaChamados();
    }

    // Desenha a tabela respeitando os filtros
    function renderizarTabelaChamados() {
      const busca = document.getElementById('busca').value.toLowerCase();
      const statusFiltro = document.getElementById('filtro-status').value;

      let filtrados = chamadosGlobais.filter(c => {
        const matchBusca = c.titulo.toLowerCase().includes(busca) || String(c.numero).includes(busca);
        const matchStatus = statusFiltro === "" || c.status === statusFiltro;
        return matchBusca && matchStatus;
      });

      if (filtrados.length === 0) {
        document.getElementById('tabela-chamados').innerHTML = "<p style='color:var(--muted); padding: 20px 0;'>Nenhum chamado encontrado com esses filtros.</p>";
        return;
      }

      let html = `<table><thead><tr><th>Nº</th><th>Serviço</th><th>Data</th><th>Status</th><th>Ação</th></tr></thead><tbody>`;
      filtrados.forEach(c => {
        html += `<tr>
          <td><b>TE-${String(c.numero).padStart(6, '0')}</b></td>
          <td>${c.titulo}</td>
          <td>${new Date(c.criado_em).toLocaleDateString('pt-BR')}</td>
          <td><span class="pill">${c.status}</span></td>
          <td><a href="chamado.html?id=${c.id}" class="btn-acao">Abrir</a></td>
        </tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById('tabela-chamados').innerHTML = html;
    }

    // Salva o perfil
    async function salvarPerfil() {
      const nome = document.getElementById('p-nome').value;
      const telefone = document.getElementById('p-telefone').value;
      const msg = document.getElementById('msg-perfil');

      const { error } = await db.from("usuarios").update({ nome, telefone }).eq("id", userId);
      
      if (error) {
        msg.textContent = "Erro ao salvar: " + error.message;
        msg.className = "msg on err";
      } else {
        msg.textContent = "Perfil atualizado com sucesso!";
        msg.className = "msg on ok";
        document.getElementById('saudacao').textContent = `Olá, ${nome.split(' ')[0]}.`;
        setTimeout(() => msg.className = "msg", 3000);
      }
    }

    // Sair
    async function sair() {
      sessionStorage.removeItem('te_user_id');
      sessionStorage.removeItem('te_user_email');
      await db.auth.signOut();
      window.location.href = "login.html";
    }

    init();
  </script>
</body>
</html>
