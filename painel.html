<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área do Cliente — TechEmpire</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="painel" data-auth="client">
<header id="site-header"></header>

<main class="wrap-main">
  <div style="max-width: 1000px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
      <div>
        <h1 style="font-size: 36px; font-family: var(--font-head);" id="saudacao">Olá, Cliente.</h1>
        <p class="lead" style="margin: 0;">Acompanhe seus atendimentos abaixo.</p>
      </div>
      <a href="novo-chamado.html" class="btn primary">+ Novo Atendimento</a>
    </div>

    <div id="lista-chamados">
      <p class="lead">Carregando seus chamados...</p>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    setTimeout(async () => {
      if (!window.App || !window.App.session) return;
      
      const db = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
      const userId = window.App.session.user.id;
      const nome = window.App.perfil?.nome || "Cliente";
      document.getElementById('saudacao').textContent = `Olá, ${nome.split(' ')[0]}.`;

      // Busca os chamados do cliente
      const { data: chamados, error } = await db.from("chamados").select("*").eq("cliente_id", userId).order("criado_em", { ascending: false });

      if (error || !chamados || chamados.length === 0) {
        document.getElementById('lista-chamados').innerHTML = "<p class='sub'>Você ainda não possui chamados.</p>";
        return;
      }

      // Monta a lista de chamados
      let html = `<div style="display: flex; flex-direction: column; gap: 24px;">`;
      
      chamados.forEach(c => {
        // Se tiver laudo, exibe a caixa verde
        let laudoHTML = "";
        if (c.laudo_tecnico) {
          const l = c.laudo_tecnico;
          laudoHTML = `
            <div style="background: rgba(0, 221, 181, 0.05); border: 1px solid var(--brand); border-radius: 12px; padding: 24px; margin-top: 24px;">
              <h4 style="color: var(--brand); font-family: var(--font-head); margin-bottom: 16px;">Laudo Técnico Emitido</h4>
              
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 16px;">
                <div>
                  <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Diagnóstico</div>
                  <div style="font-size: 15px; font-weight: 500;">${l.diagnostico}</div>
                </div>
                <div>
                  <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Solução</div>
                  <div style="font-size: 15px; font-weight: 500;">${l.solucao}</div>
                </div>
                <div>
                  <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Prazo</div>
                  <div style="font-size: 15px; font-weight: 500;">${l.prazo}</div>
                </div>
                <div>
                  <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Valor do Serviço</div>
                  <div style="font-size: 18px; font-weight: 700; color: var(--brand);">R$ ${l.valor}</div>
                </div>
              </div>

              <div style="margin-top: 24px; display: flex; gap: 12px;">
                <a href="chamado.html?id=${c.id}" class="btn primary sm">Abrir Chat</a>
                <button class="btn secondary sm">Aprovar Orçamento</button>
              </div>
            </div>
          `;
        }

        // Card do chamado
        html += `
          <div class="card" style="padding: 32px;">
            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px;">
              <div>
                <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">${c.protocolo || 'TE-S/N'}</div>
                <h3 style="font-family: var(--font-head); font-size: 20px; margin: 0;">${c.titulo}</h3>
              </div>
              <span class="pill">${c.status}</span>
            </div>
            
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.6;">
              ${c.descricao}
            </p>

            ${laudoHTML}
          </div>
        `;
      });

      html += `</div>`;
      document.getElementById('lista-chamados').innerHTML = html;

    }, 1000); // Aguarda o script.js validar o login
  });
</script>
</body>
</html>
