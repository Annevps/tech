<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta — TechEmpire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F8F9FA; --s1: #FFFFFF; --line: #E5E7EB; --line2: #D1D5DB; --ink: #1F2937; --muted: #6B7280; --lime: #8fd21f; --lime2: #7ab81a; --err: #EF4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--ink); line-height: 1.6; }
  a { text-decoration: none; color: inherit; }
  
  header { background: rgba(248,249,250,0.85); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; }
  .bar-in { max-width: 1160px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  .logo img { height: 50px; width: auto; }
  nav { display: flex; align-items: center; gap: 8px; }
  nav a { padding: 8px 14px; border-radius: 99px; font-weight: 500; font-size: 15px; color: var(--muted); }
  nav a:hover { color: var(--ink); background: var(--line); }
  .btn-nav { border: 1px solid var(--line2); padding: 8px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; }
  .btn-nav.primary { background: var(--lime); border-color: var(--lime); color: #fff; }

  .auth-container { max-width: 640px; margin: 60px auto; background: var(--s1); padding: 48px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--line); }
  .auth-container h2 { font-family: 'Space Grotesk'; font-size: 32px; margin-bottom: 8px; }
  .auth-container p.sub { color: var(--muted); margin-bottom: 32px; font-size: 15px; }
  
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .full { grid-column: 1 / -1; }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
  .form-group input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line2); background: var(--bg); color: var(--ink); font-size: 15px; transition: 0.2s; }
  .form-group input:focus { outline: none; border-color: var(--lime); background: #fff; box-shadow: 0 0 0 3px rgba(143, 210, 31, 0.15); }
  
  .btn-submit { width: 100%; background: var(--lime); color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s; }
  .btn-submit:hover { background: var(--lime2); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(143, 210, 31, 0.3); }
  
  .msg { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 14px; font-weight: 500; }
  .msg.on { display: block; }
  .msg.err { background: rgba(239, 68, 68, 0.1); color: var(--err); border: 1px solid rgba(239, 68, 68, 0.2); }
  .msg.ok { background: rgba(143, 210, 31, 0.1); color: #5c8a10; border: 1px solid rgba(143, 210, 31, 0.2); }

  .links { text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); }
  .links a { color: var(--lime2); font-weight: 600; }

  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .auth-container { padding: 24px; margin: 20px; } }
</style>
</head>
<body>
  <header>
    <div class="bar-in">
      <a href="index.html" class="logo"><img src="tech.png" alt="TechEmpire"></a>
      <nav>
        <a href="index.html">Início</a>
        <a href="login.html">Entrar</a>
        <a href="criar-conta.html" style="color: var(--ink); font-weight: 600;">Criar conta</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth-container">
      <h2>Criar conta</h2>
      <p class="sub">Você precisa de uma conta para abrir chamados.</p>
      
      <div class="msg" id="m-conta"></div>
      
      <form id="f-conta">
        <div class="grid">
          <div class="form-group full">
            <label>Nome completo</label>
            <input name="nome" required placeholder="Seu nome completo">
          </div>
          <div class="form-group">
            <label>CPF</label>
            <input name="cpf" required placeholder="000.000.000-00">
          </div>
          <div class="form-group">
            <label>WhatsApp</label>
            <input name="telefone" required placeholder="(33) 99999-9999">
          </div>
          <div class="form-group">
            <label>Rua</label>
            <input name="rua" required placeholder="Sua rua">
          </div>
          <div class="form-group">
            <label>Número</label>
            <input name="numero" required placeholder="123">
          </div>
          <div class="form-group">
            <label>Bairro</label>
            <input name="bairro" required placeholder="Seu bairro">
          </div>
          <div class="form-group">
            <label>Cidade</label>
            <input name="cidade" required placeholder="Sua cidade">
          </div>
          <div class="form-group">
            <label>Estado (UF)</label>
            <input name="estado" required maxlength="2" placeholder="MG">
          </div>
          <div class="form-group full">
            <label>E-mail</label>
            <input name="email" type="email" required placeholder="seu@email.com">
          </div>
          <div class="form-group">
            <label>Senha (mín. 8)</label>
            <input name="senha" type="password" minlength="8" required placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>Confirmar senha</label>
            <input name="senha2" type="password" minlength="8" required placeholder="••••••••">
          </div>
        </div>
        
        <button type="submit" class="btn-submit">Criar conta</button>
      </form>

      <div class="links">
        Já tem conta? <a href="login.html">Entrar</a>.
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script>
    document.getElementById('f-conta').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const msg = document.getElementById('m-conta');
      const d = Object.fromEntries(new FormData(e.target));

      if (d.senha !== d.senha2) {
        msg.textContent = "As senhas não coincidem.";
        msg.className = "msg on err";
        return;
      }

      btn.disabled = true; btn.textContent = "Criando...";
      const db = supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);

      const { data, error } = await db.auth.signUp({ 
        email: d.email.trim(), 
        password: d.senha,
        options: { data: { nome: d.nome, cpf: d.cpf, telefone: d.telefone } }
      });

      if (error) {
        btn.disabled = false; btn.textContent = "Criar conta";
        msg.textContent = error.message;
        msg.className = "msg on err";
        return;
      }

      msg.textContent = "Conta criada com sucesso! Redirecionando...";
      msg.className = "msg on ok";
      
      setTimeout(() => window.location.href = "painel.html", 1500);
    });
  </script>
</body>
</html>
